<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Setlist de Worship — Transponible</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1f232c;
        --text: #f3f4f6;
        --muted: #9aa3b2;
        --gold: #e7b45a;
        --gold-strong: #f4c777;
        --error: #f2777a;
        --ok: #7ac77a;
        --border: #2a2f3a;
        --focus: #8ab4ff;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .skip-link {
        position: absolute; left: -999px; top: 0;
        background: var(--gold); color: #111; padding: 10px 14px; border-radius: 0 0 8px 0;
        z-index: 100;
      }
      .skip-link:focus { left: 0; }
      a { color: var(--gold-strong); }
      button, select, input, textarea {
        font: inherit; color: inherit;
      }
      button {
        background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 10px; padding: 10px 14px; cursor: pointer;
        min-height: 44px;
      }
      button:hover { border-color: var(--gold); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.primary { background: var(--gold); color: #14161b; border-color: var(--gold); font-weight: 700; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      header.app {
        padding: 14px 16px; border-bottom: 1px solid var(--border);
        display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      }
      header.app h1 { font-size: 1.15rem; margin: 0; }
      header.app p { margin: 0; color: var(--muted); font-size: .85rem; }
      main { padding: 16px; max-width: 1100px; margin: 0 auto; }
      #statusMessage {
        position: fixed; bottom: 0; left: 0; right: 0; margin: 0;
        background: var(--panel); border-top: 1px solid var(--border);
        color: var(--gold-strong); padding: 8px 16px; font-size: .9rem; min-height: 1.5rem;
        text-align: center; z-index: 40;
      }
      #statusMessage:empty { display: none; }

      /* Tabs */
      [role="tablist"] { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      [role="tab"] {
        background: var(--panel); border: 1px solid var(--border); color: var(--muted);
        padding: 10px 16px; border-radius: 999px; min-height: 44px;
      }
      [role="tab"][aria-selected="true"] {
        background: var(--panel-2); color: var(--gold-strong); border-color: var(--gold);
        font-weight: 700;
      }

      /* Setlist cards */
      .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      @media (min-width: 1100px) { .cards { grid-template-columns: 1fr 1fr; } }
      .card {
        background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 14px; display: flex; flex-direction: column; gap: 8px;
      }
      .card.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
      .card .row1 { display: flex; align-items: baseline; gap: 10px; }
      .card .num {
        font-variant-numeric: tabular-nums; color: var(--gold-strong); font-weight: 700;
        min-width: 1.5em;
      }
      .card .title { font-size: 1.05rem; font-weight: 600; }
      .card .meta { color: var(--muted); font-size: .85rem; }
      .card .keys { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
        padding: 4px 8px; font-size: .85rem;
      }
      .badge .k { color: var(--gold-strong); font-weight: 700; }
      .card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .pending { color: var(--muted); font-style: italic; }

      /* Stage */
      #stageView .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      #stageView .position { color: var(--muted); font-variant-numeric: tabular-nums; }
      #stageView h2 { margin: 4px 0; font-size: clamp(1.3rem, 4vw, 2rem); }
      .keyline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
      .transpose-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      /* Estructura: recorrido de la canción con chips que llevan a cada bloque */
      .roadmap {
        background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius);
        padding: 12px; margin: 12px 0;
      }
      .roadmap h3 { margin: 0 0 4px; font-size: 1rem; color: var(--gold-strong); }
      .roadmap .hint { margin: 0 0 8px; }
      .road { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; }
      .road li { display: flex; align-items: center; gap: 4px; }
      .road li + li::before { content: "→"; color: var(--muted); font-size: .9rem; }
      .road .step {
        min-height: 44px; padding: 6px 12px; border-radius: 999px; font-size: .95rem;
        background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        display: inline-flex; align-items: center; gap: 6px;
      }
      .road .step .cue { margin-left: 0; font-size: .72rem; }
      .section .uses { color: var(--muted); font-size: .85rem; font-weight: 400; }
      .section.flash { outline: 3px solid var(--gold); outline-offset: 2px; transition: outline-color .8s ease; }
      @media (prefers-reduced-motion: reduce) { .section.flash { transition: none; } }
      .sections { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 14px; }
      .section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
      .section .slabel { color: var(--gold-strong); font-weight: 700; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
      .section .repeats { color: var(--muted); font-size: .85rem; }
      /* Indicación de arreglo por sección (p. ej. "entra acústica"), dato de Darío */
      .section .cue {
        margin-left: auto; font-size: .8rem; font-weight: 600;
        color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 999px; padding: 2px 10px; white-space: nowrap;
      }
      .measures { display: flex; flex-wrap: wrap; gap: 8px; }
      /* Grilla de compases: 4 por fila, ancho fijo, barras como separadores.
         Cada compás reparte su ancho entre sus acordes (tiempos parejos). */
      .bars {
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
        border-top: 1px solid var(--border);
      }
      .bar {
        display: grid; align-items: center; gap: 2px; min-height: 56px;
        padding: 4px 4px 4px 6px;
        border-left: 2px solid var(--muted); border-bottom: 1px solid var(--border);
      }
      .bar:nth-child(4n), .bar:last-child { border-right: 2px solid var(--muted); }
      .bar .chord {
        min-width: 0; justify-self: start; padding: 4px 6px;
        font-size: clamp(1rem, 3.4vw, 1.45rem); line-height: 1.1;
      }
      @media (max-width: 360px) { .bar .chord { font-size: .95rem; padding: 4px 3px; } }
      .measure {
        display: flex; gap: 8px; align-items: center;
        border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
        font-size: clamp(1.1rem, 3.5vw, 1.6rem); font-weight: 700;
      }
      /* Acordes como botones: hover o tap muestran la digitación */
      .chord {
        background: none; border: 1px solid transparent; border-radius: 8px;
        padding: 6px 10px; min-height: 44px; min-width: 44px;
        color: var(--gold-strong); font: inherit; font-weight: 700; cursor: pointer;
      }
      .chord:hover, .chord:focus-visible, .chord[aria-expanded="true"] {
        border-color: var(--gold); background: var(--panel-2);
      }
      .capo-hint { color: var(--gold-strong); }
      /* Grado de la escala como subíndice de cada acorde */
      .chord sub.deg {
        font-size: .55em; line-height: 1; margin-left: 2px;
        color: var(--muted); font-weight: 600; vertical-align: sub;
      }
      #chordPopover {
        position: absolute; z-index: 60; width: 240px;
        background: var(--panel); border: 1px solid var(--gold); border-radius: 12px;
        padding: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .55);
      }
      #chordPopover h4 { margin: 0 0 2px; font-size: 1.2rem; color: var(--gold-strong); }
      #chordPopover .cap { color: var(--muted); font-size: .85rem; margin: 0 0 8px; }
      #chordPopover svg { display: block; width: 100%; height: auto; }
      #chordPopover .frets { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
      .panel {
        background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 12px; margin: 12px 0;
      }
      .panel h3 { margin: 0 0 8px; font-size: 1rem; }
      .lyrics-text { white-space: pre-wrap; font-size: 1rem; line-height: 1.6; }
      .nav-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
      .metronome-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .metronome-controls input[type="number"] { width: 5em; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); min-height: 44px; }
      .metronome-controls input[type="range"] { min-height: 44px; }
      dialog {
        background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: var(--radius); max-width: 640px; width: calc(100% - 32px); padding: 16px;
      }
      dialog::backdrop { background: rgba(0,0,0,.6); }
      dialog textarea { width: 100%; min-height: 200px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
      .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
      .hint { color: var(--muted); font-size: .85rem; }
      .err { color: var(--error); }
      select { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; min-height: 44px; }
      #youtubeContainer iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
      /* Pantalla completa (Fullscreen API o modo pseudo para navegadores sin
         API, como Safari en iPhone): #stageView ocupa la pantalla y SCROLLEA
         por sí mismo. Sin overflow propio el contenido quedaba recortado. */
      #stageView:fullscreen,
      #stageView:-webkit-full-screen,
      #stageView.pseudo-fullscreen {
        position: fixed; inset: 0; width: 100%; height: 100%; z-index: 45;
        overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
        background: var(--bg); color: var(--text); box-sizing: border-box;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                 max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      body.pseudo-fullscreen-open { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Saltar al contenido</a>
    <header class="app">
      <h1>Setlist de Worship</h1>
      <p>Cuatro reuniones · acordes transponibles · letras locales</p>
    </header>

    <main id="mainContent">
      <section id="setlistView" aria-label="Listado de canciones por reunión">
        <div id="tablist" role="tablist" aria-label="Reuniones"></div>
        <div id="tabpanel" role="tabpanel">
          <ol class="cards" id="songCards"></ol>
        </div>
      </section>

      <section id="stageView" hidden aria-label="Visor de escenario"></section>
    </main>

    <p id="statusMessage" aria-live="polite" role="status"></p>

    <!-- Popover de digitación: se llena al tocar/clic sobre un acorde (sin hover) -->
    <div id="chordPopover" role="dialog" aria-labelledby="chordPopoverTitle" hidden></div>

    <dialog id="lyricsDialog" aria-labelledby="lyricsDialogTitle">
      <h3 id="lyricsDialogTitle">Letra de la canción</h3>
      <p class="hint" id="lyricsDialogHint">
        Pegá una letra que hayas aportado o para la que tengas autorización, o cargá un archivo .txt (UTF-8, máx. 200 KiB).
      </p>
      <textarea id="lyricsTextarea" aria-describedby="lyricsDialogHint lyricsDialogError"></textarea>
      <p id="lyricsDialogError" class="err" role="alert"></p>
      <div class="dialog-actions">
        <label class="badge">
          Cargar .txt
          <input type="file" id="lyricsFile" accept=".txt,text/plain" style="max-width: 12em;" />
        </label>
        <button type="button" id="lyricsCancel">Cancelar</button>
        <button type="button" class="primary" id="lyricsSave">Guardar</button>
      </div>
    </dialog>

    <script type="module">
/* content-module:start */
// Coro de "Todo es posible" (chart oficial Bethel, Bb → D). Se reutiliza en
// cada aparición del coro dentro del orden de ejecución.
const TODO_ES_POSIBLE_CORO = [["G"], ["D", "A"], ["G"], ["D", "A"], ["G"], ["Bm", "D"], ["G"], ["D", "A", "D"]];
const TODO_ES_POSIBLE_VERSO = [["D"], ["D/F#", "G"], ["D"], ["D/F#", "G"], ["Bm", "A"], ["D/F#", "G"], ["D"]];

// "A Jesús seguiré" (TWICE, chart en G): bloques que se repiten en el orden
// de ejecución. Sólo acordes.
const A_JESUS_CORO = [["G"], ["D", "A"], ["G"], ["D", "A"], ["G", "D", "A"]];
const A_JESUS_PRECORO = [["G"], ["D", "A"], ["G", "D", "A"]];
const A_JESUS_TAG = [["G", "D", "A"]];

// "Creeré" (chart oficial Bethel, Bb → A): coro y puente se repiten en el
// orden de ejecución. Sólo acordes.
const CREERE_CORO = [["A", "Asus", "A"], ["F#m", "E", "D", "E"], ["A", "Asus", "A"], ["F#m", "E", "D", "A"]];
const CREERE_PUENTE = [["A", "E/G#"], ["F#m", "E", "D"], ["A", "E/G#"], ["F#m", "E", "D"], ["A"], ["F#m", "D"], ["A/E", "F#m", "E"], ["D"], ["D"]];

// "Jehová": acordes del chart de Elevation (formas de C con capo 1 = Db,
// normalizadas a E) sobre la ESTRUCTURA dictada por la banda (Darío,
// 2026-09-09). Coro unificado (remate con Esus); un solo Puente.
const JEHOVA_CORO = [["E", "A"], ["E"], ["C#m"], ["A", "E"], ["A"], ["E"], ["C#m"], ["A", "E", "Esus"]];
const JEHOVA_PUENTE = [["E", "Asus2"], ["E", "Asus2", "A"]];
const JEHOVA_VAMP = [["E", "Esus"], ["E", "Esus"]]; // Interludio y Outro (2 compases)

// "Lavado": arreglo de la banda (Darío, 2026-09-09). Lo tocan leyendo formas
// de A con capo 2 → suena en B (el tono del setlist y de la grabación).
// Formas dictadas → acordes reales (+2):
//   Intro  A | A5 | E | F#m            → B | B5 | F# | G#m
//   Verso  Intro ×3 y 4ª vuelta B | D  → … C# | E
//   Coro   A5 | D2 | F# | E           → B5 | E2 | G# | F#   (F# mayor, tal como se dictó)
//   Puente 1 4 6m 4 (Elevation) en B   → B E G#m E  (formas A D F#m D)
const LAVADO_INTRO = [["B"], ["B5"], ["F#"], ["G#m"]];
const LAVADO_VERSO = [...LAVADO_INTRO, ...LAVADO_INTRO, ...LAVADO_INTRO, ["C#"], ["E"]];
const LAVADO_CORO = [["B5"], ["E2"], ["G#"], ["F#"]];
const LAVADO_PUENTE = [["B"], ["E"], ["G#m"], ["E"]];

// "El Nombre de Jesús" (chart en Db → D, +1). Bloques repetidos.
const NOMBRE_JESUS_INSTR1 = [["Em"], ["G"], ["Em"], ["G"], ["Bm"], ["A"], ["Bm"], ["A"]];
const NOMBRE_JESUS_CORO3 = [["Em", "G"], ["D", "Bm", "A"], ["Em", "G"], ["D", "Bm", "A"]];

// "Canta al Señor" (Ingrid Rosario; chart en A → G, −2). El F es el bVII
// prestado (G en el chart original).
const CANTA_VERSO = [["G", "D"], ["Em", "D", "C"], ["G", "C", "G"], ["F", "C", "D"]];

// "Al que está sentado" (Marcos Brunet, chart en A = asignado). Bloques repetidos.
const SENTADO_VERSO = [["A2"], ["F#m"], ["E", "D"], ["D11+", "D"], ["F#m"], ["E"], ["D"], ["E4", "E"]];
const SENTADO_TAG = [["Bm", "A/C#"], ["D", "E"]];

// "Digno de alabar" = Worthy Of It All (CeCe Winans, chart en D = asignado).
const WORTHY_CORO_B = [["D"], ["A"], ["D/F#", "G"], ["Bm", "A"], ["D"]];

export const setlists = [
  {
    id: "2026-09-04",
    label: "Viernes 4",
    shortLabel: "Vie 4",
    date: "2026-09-04",
    songs: [
      song("todo-es-posible", "Todo es posible", "D", {
        artist: "Bethel Music, Dante Bowe (Anything Is Possible · Live)",
        // Única cifra en Cifra Club: está bajo un artista mal escrito ("Bettel Music").
        chartUrl: "https://www.cifraclub.com/bettel-music/anything-is-possible/",
        sourceKey: "Bb",
        tempoBpm: 122,
        beatsPerMeasure: 4,
        // Chart oficial de Bethel Music (CCLI 7148926, tono original Bb,
        // 122 BPM) aportado por Darío; normalizado a D (+4). Sólo acordes.
        sections: [
          { type: "verse", label: "Verso 1", repeats: 1, measures: [["D"], ["D"], ["D"], ["D"], ["Bm"], ["G"], ["D"]] },
          { type: "verse", label: "Verso 2", repeats: 1, measures: TODO_ES_POSIBLE_VERSO },
          { type: "chorus", label: "Coro", repeats: 1, measures: TODO_ES_POSIBLE_CORO },
          { type: "verse", label: "Verso 3", repeats: 1, measures: TODO_ES_POSIBLE_VERSO },
          { type: "chorus", label: "Coro", repeats: 1, measures: TODO_ES_POSIBLE_CORO },
          { type: "instrumental", label: "Canal", repeats: 2, measures: [["D"], ["D"]] },
          { type: "bridge", label: "Puente", repeats: 1, measures: [["D"], ["D"], ["D"], ["D"]] },
          { type: "bridge", label: "Puente (acordes alternos)", repeats: 2, measures: [["Bm"], ["A"], ["D/F#"], ["G"], ["Bm"], ["A"], ["D"], ["G"]] },
          { type: "chorus", label: "Coro", repeats: 1, measures: TODO_ES_POSIBLE_CORO },
          { type: "instrumental", label: "Instrumental", repeats: 1, measures: [["G"], ["G"], ["D"], ["A"], ["G"], ["G"], ["D"], ["A"], ["G"], ["G"], ["Bm"], ["D"], ["G"], ["G"], ["D"], ["A"]] }
        ]
      }),
      song("a-jesus-seguire", "A Jesús seguiré", "G", {
        artist: "TWICE, Job González",
        sourceKey: "G",
        beatsPerMeasure: 4,
        // Chart en G aportado por Darío (PDF, 2026-09-07); sin transposición.
        // Tres acordes (G, D, A). Sin BPM en la fuente. Sólo acordes.
        sections: [
          { type: "chorus", label: "Coro", repeats: 1, measures: A_JESUS_CORO },
          { type: "tag", label: "Tag", repeats: 1, measures: A_JESUS_TAG },
          { type: "verse", label: "Verso 1", repeats: 1, measures: [["G", "D", "A"], ["G", "D"], ["A"], ["G", "D", "A"], ["G", "D"], ["A"]] },
          { type: "prechorus", label: "Pre-coro", repeats: 1, measures: A_JESUS_PRECORO },
          { type: "chorus", label: "Coro", repeats: 1, measures: A_JESUS_CORO },
          { type: "verse", label: "Verso 2", repeats: 1, measures: [["G", "D", "A"], ["G", "D"], ["G", "D", "A"], ["G"], ["D", "A"]] },
          { type: "prechorus", label: "Pre-coro", repeats: 1, measures: A_JESUS_PRECORO },
          { type: "chorus", label: "Coro", repeats: 1, measures: A_JESUS_CORO },
          { type: "tag", label: "Tag", repeats: 1, measures: A_JESUS_TAG },
          { type: "prechorus", label: "Pre-coro", repeats: 1, measures: A_JESUS_PRECORO },
          { type: "tag", label: "Tag", repeats: 2, measures: A_JESUS_TAG },
          { type: "prechorus", label: "Pre-coro", repeats: 1, measures: A_JESUS_PRECORO },
          { type: "tag", label: "Tag", repeats: 2, measures: A_JESUS_TAG },
          { type: "chorus", label: "Coro (final)", repeats: 1, measures: A_JESUS_CORO },
          { type: "tag", label: "Tag", repeats: 1, measures: A_JESUS_TAG }
        ]
      }),
      song("creere", "Creeré", "A", {
        artist: "Bethel Music, Jonathan David Helser, Melissa Helser",
        sourceKey: "Bb",
        tempoBpm: 72,
        beatsPerMeasure: 4,
        // Chart oficial de Bethel Music (CCLI 7176941, adaptación al español;
        // tono original Bb, 72 BPM) aportado por Darío; normalizado a A (−1).
        // Las multipistas oficiales del zip están en "Tonalidad de A". Sólo acordes.
        sections: [
          { type: "intro", label: "Intro", repeats: 1, measures: [["D"], ["A", "D"], ["A", "D"], ["A", "D"], ["A", "D"]] },
          { type: "verse", label: "Verso 1", repeats: 1, measures: [["A", "Asus", "A"], ["Asus", "A"], ["F#m"], ["D", "A", "F#m", "E", "D"]] },
          { type: "chorus", label: "Coro 1", repeats: 1, measures: CREERE_CORO },
          { type: "instrumental", label: "Transición 1", repeats: 1, measures: [["A", "D"], ["A", "D"]] },
          { type: "verse", label: "Verso 2", repeats: 1, measures: [["A"], ["Asus", "A"], ["A", "Asus", "A"], ["F#m"], ["D", "A", "F#m", "E", "D"]] },
          { type: "chorus", label: "Coro", repeats: 1, measures: CREERE_CORO },
          { type: "instrumental", label: "Transición 2", repeats: 1, measures: [["A", "E/G#"], ["F#m", "E"], ["D"]] },

/**
 * Fábrica de canción con estado inicial "pending": sin fuente confirmada, sin
 * acordes inventados y sin letra precargada. Las fuentes confirmadas se
 * completan en la fase de investigación de contenido.
 */
function song(id, title, assignedKey, overrides = {}) {
  const base = {
    id,
    title,
    artist: "Versión por confirmar",
    assignedKey,
    sourceKey: null,
    sourceStatus: "pending",
    lyricsUrl: null,
    chartUrl: null, // enlace externo a la cifra/tablatura (Cifra Club); no se extrae contenido
    youtubeUrl: null,
    youtubeVideoId: null,
    tempoBpm: null,
    beatsPerMeasure: 4,
    capo: null, // capo con el que la banda toca la canción (dato del arreglo); null = sugerido
    sections: []
  };
  const merged = { ...base, ...overrides };
  // Una fuente con acordes capturados se considera confirmada.
  if (merged.sections.length > 0) merged.sourceStatus = "confirmed";
  return merged;
}

export const appearanceKey = (setlistId, songId) => `${setlistId}:${songId}`;

export function validateSetlists(items) {
  const errors = [];
  for (const setlist of items) {
    if (setlist.songs.length !== 7) errors.push(`${setlist.id}: expected 7 songs`);
    const ids = new Set();
    for (const s of setlist.songs) {
      if (ids.has(s.id)) errors.push(`${setlist.id}: duplicate ${s.id}`);
      ids.add(s.id);
      if (!/^[A-G](?:#|b)?$/.test(s.assignedKey)) errors.push(`${setlist.id}:${s.id}: invalid key`);
      // `pending` gobierna sólo los acordes: nunca se inventan. Artista, video y
      // enlaces se confirman por separado (fuente de verdad: playlist de Darío)
      // y pueden existir aunque el chart siga pendiente.
      if (s.sourceStatus === "pending" && s.sections.length) errors.push(`${setlist.id}:${s.id}: pending source has sections`);
      if (s.youtubeVideoId && !/^[A-Za-z0-9_-]{11}$/.test(s.youtubeVideoId)) {
        errors.push(`${setlist.id}:${s.id}: invalid youtubeVideoId`);
      }
      if (s.chartUrl && !/^https:\/\/www\.cifraclub\.com\/[a-z0-9-]+\/[a-z0-9-]+\/$/.test(s.chartUrl)) {
        errors.push(`${setlist.id}:${s.id}: chartUrl must be a Cifra Club song page`);
      }
    }
  }
  return errors;
}

export const allAppearanceKeys = () =>
  setlists.flatMap((sl) => sl.songs.map((s) => appearanceKey(sl.id, s.id)));
/* content-module:end */

/* transposer-module:start */
export const TRANSPOSE_LIMIT = 11;
const SHARP_NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLAT_NOTES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
const ROOT_PATTERN = /^([A-G](?:#|b)?)([^/]*)(?:\/([A-G](?:#|b)?))?$/;

const NOTE_INDEX = (() => {
  const map = Object.create(null);
  SHARP_NOTES.forEach((n, i) => { map[n] = i; });
  FLAT_NOTES.forEach((n, i) => { map[n] = i; });
  // Enharmónicos poco comunes que podrían aparecer en fuentes.
  Object.assign(map, { "E#": 5, "B#": 0, "Cb": 11, "Fb": 4 });
  return map;
})();

const mod12 = (n) => ((n % 12) + 12) % 12;

export function keyToPitchClass(key) {
  const pc = NOTE_INDEX[key];
  return pc === undefined ? null : pc;
}

export function parseChord(chord) {
  if (typeof chord !== "string") return null;
  const match = ROOT_PATTERN.exec(chord.trim());
  if (!match) return null;
  const [, root, suffix, bass] = match;
  if (keyToPitchClass(root) === null) return null;
  if (bass && keyToPitchClass(bass) === null) return null;
  return { root, suffix: suffix ?? "", bass: bass ?? null };
}

export function semitoneDistance(from, to) {
  const a = keyToPitchClass(from);
  const b = keyToPitchClass(to);
  if (a === null || b === null) return 0;
  let d = mod12(b - a);
  if (d > 6) d -= 12;
  return d;
}

export function transposeChord(chord, semitones, accidentalMode = "sharp") {
  const parsed = parseChord(chord);
  if (!parsed) return chord;
  const table = accidentalMode === "flat" ? FLAT_NOTES : SHARP_NOTES;
  const newRoot = table[mod12(keyToPitchClass(parsed.root) + semitones)];
  const newBass = parsed.bass
    ? table[mod12(keyToPitchClass(parsed.bass) + semitones)]
    : null;
  return newRoot + parsed.suffix + (newBass ? `/${newBass}` : "");
}

export function transposeSections(sections, semitones, accidentalMode = "sharp") {
  return sections.map((section) => ({
    ...section,
    measures: section.measures.map((measure) =>
      measure.map((chord) => transposeChord(chord, semitones, accidentalMode))
    )
  }));
}

// Charts en números (Nashville), como los oficiales de Elevation Español:
// "1", "4", "6m", "2m", "1/3" → acordes en la tonalidad dada, con la escritura
// natural de esa tonalidad (bemoles en F/Bb/Eb/Ab/Db/Gb, sostenidos en el resto).
const MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];
const FLAT_KEYS = new Set(["F", "Bb", "Eb", "Ab", "Db", "Gb", "Cb"]);
const DEGREE_RE = /^([1-7])([^/]*)(?:\/([1-7]))?$/;

export function degreeToChord(token, keyRoot) {
  const m = DEGREE_RE.exec(String(token ?? "").trim());
  const rootPc = keyToPitchClass(keyRoot);
  if (!m || rootPc === null) return token; // no es un grado (p. ej. "N.C."): intacto
  const table = FLAT_KEYS.has(keyRoot) ? FLAT_NOTES : SHARP_NOTES;
  const note = (deg) => table[mod12(rootPc + MAJOR_SCALE[Number(deg) - 1])];
  const suffix = m[2] === "°" ? "dim" : m[2];
  return note(m[1]) + suffix + (m[3] ? `/${note(m[3])}` : "");
}

export function degreesToSections(sections, keyRoot) {
  return sections.map((section) => ({
    ...section,
    measures: section.measures.map((measure) => measure.map((t) => degreeToChord(t, keyRoot)))
  }));
}

// Inversa: acorde → grado en la tonalidad (números, estilo Nashville). Los no
// diatónicos llevan alteración (b3, #4, b7); los acordes con bajo van "1/3".
// La calidad (m, 7…) no se incluye: ya está en el símbolo del acorde.
const DEGREE_NAMES = ["1", "b2", "2", "b3", "3", "4", "#4", "5", "b6", "6", "b7", "7"];

export function chordToDegree(chord, keyRoot) {
  const parsed = parseChord(chord);
  const keyPc = keyToPitchClass(keyRoot);
  if (!parsed || keyPc === null) return "";
  const deg = (note) => DEGREE_NAMES[mod12(keyToPitchClass(note) - keyPc)];
  return deg(parsed.root) + (parsed.bass ? `/${deg(parsed.bass)}` : "");
}
/* transposer-module:end */

/* navigation-module:start */
export function initialState() {
  return {
    view: "setlist",
    activeSetlistIndex: 0,
    selectedSongIndex: 0,
    transpositions: {},
    tempoOverrides: {},
    meterOverrides: {},
    capoOverrides: {},
    chartLayout: "grid", // "grid" = grilla de compases (4 por fila) · "flow" = recuadros
    accidentalMode: "sharp",
    metronomeRunning: false
  };
}

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

export function selectSetlist(state, index) {
  return {
    ...state,
    activeSetlistIndex: clamp(index, 0, 3),
    selectedSongIndex: 0,
    metronomeRunning: false
  };
}

export function selectSong(state, index) {
  return {
    ...state,
    selectedSongIndex: clamp(index, 0, 6),
    metronomeRunning: false
  };
}

export function moveSong(state, delta) {
  return {
    ...state,
    selectedSongIndex: clamp(state.selectedSongIndex + delta, 0, 6),
    metronomeRunning: false
  };
}

export function setTranspose(state, setlistId, songId, semitones) {
  const key = `${setlistId}:${songId}`;
  return {
    ...state,
    transpositions: {
      ...state.transpositions,
      [key]: clamp(Math.trunc(semitones), -11, 11)
    }
  };
}

/** Capo manual por aparición (0..11). `null` vuelve al capo automático. */
export function setCapo(state, setlistId, songId, capo) {
  const key = `${setlistId}:${songId}`;
  const capoOverrides = { ...(state.capoOverrides ?? {}) };
  if (capo === null || capo === undefined) delete capoOverrides[key];
  else capoOverrides[key] = clamp(Math.trunc(capo), 0, 11);
  return { ...state, capoOverrides };
}

/* lyrics-store-module:start */
export const MAX_LYRIC_BYTES = 200 * 1024;

export function validateLyricText(text) {
  if (typeof text !== "string" || !text.trim()) {
    return { ok: false, error: "La letra está vacía" };
  }
  if (text.includes("�")) {
    return { ok: false, error: "El archivo no contiene texto UTF-8 legible" };
  }
  if (new TextEncoder().encode(text).byteLength > MAX_LYRIC_BYTES) {
    return { ok: false, error: "La letra supera 200 KiB" };
  }
  return { ok: true };
}

export function parseLyricsBackup(json, validKeys) {
  const valid = new Set(validKeys);
  const errors = [];
  let data;
  try {
    data = typeof json === "string" ? JSON.parse(json) : json;
  } catch {
    return { ok: false, lyrics: {}, errors: ["JSON inválido"] };
  }
  if (!data || data.schemaVersion !== 1 || typeof data.lyrics !== "object") {
    return { ok: false, lyrics: {}, errors: ["Esquema desconocido"] };
  }
  const lyrics = {};
  for (const [key, value] of Object.entries(data.lyrics)) {
    if (!valid.has(key)) { errors.push(`Clave inexistente: ${key}`); continue; }
    if (!value || typeof value.text !== "string") { errors.push(`Valor inválido: ${key}`); continue; }
    if (!validateLyricText(value.text).ok) { errors.push(`Texto inválido: ${key}`); continue; }
    lyrics[key] = {
      text: value.text,
      updatedAt: typeof value.updatedAt === "string" ? value.updatedAt : new Date().toISOString()
    };
  }
  return { ok: errors.length === 0, lyrics, errors };
}

export function mergeLyrics(current, incoming) {
  const collisions = Object.keys(incoming).filter((k) => k in current);
  return { merged: { ...current, ...incoming }, collisions };
}

export function serializeLyricsBackup(lyrics, now = new Date().toISOString()) {
  return JSON.stringify({ schemaVersion: 1, exportedAt: now, lyrics }, null, 2);
}
/* lyrics-store-module:end */

/* youtube-module:start */
const YT_HOSTS = new Set(["youtube.com", "www.youtube.com", "m.youtube.com", "music.youtube.com", "youtu.be"]);

export const isValidYouTubeId = (id) => /^[A-Za-z0-9_-]{11}$/.test(id ?? "");

export function extractYouTubeId(url) {
  let parsed;
  try {
    parsed = new URL(url);
  } catch {
    return null;
  }
  if (!YT_HOSTS.has(parsed.hostname)) return null;
  let id = null;
  if (parsed.hostname === "youtu.be") {
    id = parsed.pathname.slice(1).split("/")[0];
  } else if (parsed.pathname === "/watch") {
    id = parsed.searchParams.get("v");
  } else if (parsed.pathname.startsWith("/embed/")) {
    id = parsed.pathname.slice("/embed/".length).split("/")[0];
  }
  return isValidYouTubeId(id) ? id : null;
}

export function buildYouTubeEmbedUrl(id) {
  if (!isValidYouTubeId(id)) throw new TypeError("Invalid YouTube video id");
  return `https://www.youtube-nocookie.com/embed/${id}`;
}
/* youtube-module:end */

export const clampBpm = (value) => Math.max(40, Math.min(240, Math.round(Number(value) || 120)));
export const normalizeMeter = (value) => ([2, 3, 4, 6].includes(Number(value)) ? Number(value) : 4);
export const secondsPerBeat = (bpm) => 60 / clampBpm(bpm);
export function advanceBeat(currentBeat, beatsPerMeasure) {
  const beat = (currentBeat + 1) % normalizeMeter(beatsPerMeasure);
  return { beat, accented: beat === 0 };
}

// Digitaciones de guitarra orientadas a worship (formas abiertas y voicings
// habituales del género), no clásicas. Las formas viven en tonalidades
// "abiertas"; para las demás se sugiere capo, que es lo que se hace en worship.
// `transpose` se inyecta (es transposeChord) para mantener el bloque puro y
// probable de forma aislada.
export const OPEN_KEYS = ["C", "D", "E", "G", "A"];
export const MAX_SUGGESTED_CAPO = 7;

// el dominante con novena; "E4" es Esus4. Se resuelven como alias de forma.
const SUFFIX_ALIASES = {
  "2": "add9", "9": "add9", "4": "sus4", "sus": "sus4", "M7": "maj7", "Maj7": "maj7", "maj": "",
  "min": "m", "-": "m", "-7": "m7"
};

const X = "x";
const V = (frets, fingers, extra = {}) => ({ frets, fingers, ...extra });

  "F#m7":  V([2, 4, 2, 2, 2, 2], [1, 3, 1, 1, 1, 1], { barre: { fret: 2, from: 0, to: 5 } }),
  "F#":    V([2, 4, 4, 3, 2, 2], [1, 3, 4, 2, 1, 1], { barre: { fret: 2, from: 0, to: 5 } }),

  "G#m7":  V([4, 6, 4, 4, 4, 4], [1, 3, 1, 1, 1, 1], { barre: { fret: 4, from: 0, to: 5 } })

export function normalizeChordSymbol(symbol) {
  const m = CHORD_RE.exec(String(symbol ?? "").trim());
  if (!m) return null;
  const [, root, rawSuffix = "", bass] = m;
  const suffix = rawSuffix in SUFFIX_ALIASES ? SUFFIX_ALIASES[rawSuffix] : rawSuffix;
  return { root, suffix, bass: bass ?? null, symbol: root + suffix + (bass ? `/${bass}` : "") };
}

/** Voicing para un símbolo (con alias); si es acorde con bajo y no hay forma
 *  específica, cae a la forma base y lo aclara. null si no hay digitación. */
export function findVoicing(symbol) {
  const n = normalizeChordSymbol(symbol);
  if (!n) return null;
  if (WORSHIP_VOICINGS[n.symbol]) return { symbol: n.symbol, exact: true, ...WORSHIP_VOICINGS[n.symbol] };
  if (n.bass) {
    const base = n.root + n.suffix;
    if (WORSHIP_VOICINGS[base]) {
      return { symbol: base, exact: false, ...WORSHIP_VOICINGS[base], note: `Forma de ${base}; el bajo ${n.bass} queda a criterio del bajista/segunda guitarra` };
    }
  }
  return null;
}

/**
 * Capo sugerido (0..7) para una tonalidad, considerando los acordes del tema.
 * Práctica de worship: se prefiere el capo más bajo que cae en una tonalidad
 * abierta, salvo que otro capo elimine cejillas. Una sola cejilla no mueve el
 * capo (Bm en D o F#m en A son habituales); dos o más sí. Los acordes sin
 * digitación en la tabla cuentan como cejilla. Sin acordes, se comporta como
 * "el capo más bajo a tonalidad abierta".
 */
export function suggestCapo(keyRoot, transpose, chords = []) {
  const playable = chords.filter((c) => c !== "N.C.");
  const candidates = [];
  for (let capo = 0; capo <= MAX_SUGGESTED_CAPO; capo++) {
    const shapeRoot = transpose(keyRoot, -capo, "sharp");
    if (!OPEN_KEYS.includes(shapeRoot)) continue;
    const barres = playable.reduce((n, chord) => {
      const v = findVoicing(transpose(chord, -capo, "sharp"));
      return n + (!v || v.barre ? 1 : 0);
    }, 0);
    candidates.push({ capo, shapeRoot, barres });
  }
  if (candidates.length === 0) return { capo: 0, shapeRoot: keyRoot, barres: 0 };
  const lowest = candidates[0];
  if (lowest.barres <= 1) return lowest;
  return candidates.reduce(
    (best, c) => (c.barres < best.barres || (c.barres === best.barres && c.capo < best.capo) ? c : best),
    lowest
  );
}

/** Forma que se digita para un acorde sonante con un capo dado. */
export function shapeForCapo(symbol, capo, transpose) {
  return capo ? transpose(symbol, -capo, "sharp") : symbol;
}

/** Errores de integridad de la tabla (para pruebas). */
export function voicingsIntegrity(table = WORSHIP_VOICINGS) {
  const errors = [];
  for (const [sym, v] of Object.entries(table)) {
    if (!Array.isArray(v.frets) || v.frets.length !== 6) errors.push(`${sym}: frets must have 6 entries`);
    if (!Array.isArray(v.fingers) || v.fingers.length !== 6) errors.push(`${sym}: fingers must have 6 entries`);
    v.frets?.forEach((f, i) => {
      if (!(f === "x" || (Number.isInteger(f) && f >= 0 && f <= 15))) errors.push(`${sym}: bad fret at ${i}`);
      const fg = v.fingers?.[i];
      if (!(Number.isInteger(fg) && fg >= 0 && fg <= 4)) errors.push(`${sym}: bad finger at ${i}`);
      if ((f === "x" || f === 0) && fg !== 0) errors.push(`${sym}: finger on open/muted string ${i}`);
    });
    if (v.barre) {
      const { fret, from, to } = v.barre;
      if (!(from >= 0 && to <= 5 && from < to)) errors.push(`${sym}: bad barre range`);
      if (!v.frets.slice(from, to + 1).some((f) => f === fret)) errors.push(`${sym}: barre fret not in frets`);
    }
    if (!normalizeChordSymbol(sym) || normalizeChordSymbol(sym).symbol !== sym) errors.push(`${sym}: key is not canonical`);
  }
  return errors;
}
/* voicings-module:end */

/* structure-module:start */
// Estructura de la canción para el escenario: el RECORRIDO en orden (con
// repeticiones e indicaciones) y los BLOQUES ÚNICOS de acordes. Secciones con la
// misma secuencia de acordes se muestran una sola vez, con todas sus etiquetas
// ("Verso 1 · Verso 2"). Si una misma etiqueta corresponde a secuencias
// distintas, se desambigua con (A), (B)… por orden de aparición.
export const SECTION_TYPE_LABELS = {
  intro: ["Intro", "Intros"], verse: ["Verso", "Versos"], prechorus: ["Pre-coro", "Pre-coros"],
  chorus: ["Coro", "Coros"], bridge: ["Puente", "Puentes"], instrumental: ["Instrumental", "Instrumentales"],
  interlude: ["Interludio", "Interludios"], vamp: ["Vamp", "Vamps"], tag: ["Tag", "Tags"],
  outro: ["Outro", "Outros"], other: ["Sección", "Secciones"]
};

export function songStructure(sections) {
  const blocks = [];
  const byKey = new Map();
  const roadmap = sections.map((s, index) => {
    const key = JSON.stringify(s.measures);
    let block = byKey.get(key);
    if (!block) {
      block = { id: blocks.length, labels: [], occurrences: [], measures: s.measures, firstIndex: index };
      byKey.set(key, block);
      blocks.push(block);
    }
    if (!block.labels.includes(s.label)) block.labels.push(s.label);
    block.occurrences.push(index);
    return { index, label: s.label, repeats: s.repeats ?? 1, cue: s.cue ?? null, type: s.type ?? "other", blockId: block.id };
  });

  // Una etiqueta usada por más de un bloque distinto → sufijo (A), (B)…
  const labelToBlocks = new Map();
  for (const b of blocks) for (const l of b.labels) labelToBlocks.set(l, [...(labelToBlocks.get(l) ?? []), b.id]);
  const suffix = new Map();
  for (const [label, ids] of labelToBlocks) {
    if (ids.length > 1) ids.forEach((id, i) => suffix.set(`${id}|${label}`, ` (${String.fromCharCode(65 + i)})`));
  }
  const display = (blockId, label) => label + (suffix.get(`${blockId}|${label}`) ?? "");

  const namedBlocks = blocks.map((b) => {
    const displayLabels = b.labels.map((l) => display(b.id, l));
    return { ...b, displayLabels, title: displayLabels.join(" · ") };
  });
  const namedRoadmap = roadmap.map((r) => ({ ...r, displayLabel: display(r.blockId, r.label) }));

  // Resumen de tipos: cuántas secciones DISTINTAS (por etiqueta) hay de cada tipo.
  const perType = new Map();
  sections.forEach((s, i) => {
    const t = s.type ?? "other";
    const e = perType.get(t) ?? { type: t, labels: new Set(), firstIndex: i };
    e.labels.add(s.label);
    perType.set(t, e);
  });
  const typeSummary = [...perType.values()].sort((a, b) => a.firstIndex - b.firstIndex)
    .map((e) => ({ type: e.type, count: e.labels.size }));

  return { roadmap: namedRoadmap, blocks: namedBlocks, typeSummary };
}

export function structureSummary(typeSummary, labels = SECTION_TYPE_LABELS) {
  return typeSummary.map(({ type, count }) => {
    const [singular, plural] = labels[type] ?? labels.other;
    return count > 1 ? `${count} ${plural.toLowerCase()}` : singular;
  }).join(" · ");
}
/* structure-module:end */

/* ============================================================
   Capa DOM (impura): consume los módulos puros de arriba.
   ============================================================ */

const LYRICS_STORAGE_KEY = "worship-setlist:lyrics:v1";
const CHROMATIC = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

const el = {
  setlistView: document.getElementById("setlistView"),
  stageView: document.getElementById("stageView"),
  status: document.getElementById("statusMessage"),
  tablist: document.getElementById("tablist"),
  cards: document.getElementById("songCards"),
  dialog: document.getElementById("lyricsDialog"),
  textarea: document.getElementById("lyricsTextarea"),
  dialogError: document.getElementById("lyricsDialogError"),
  lyricsFile: document.getElementById("lyricsFile"),
  lyricsSave: document.getElementById("lyricsSave"),
  lyricsCancel: document.getElementById("lyricsCancel"),
  popover: document.getElementById("chordPopover")
};

let state = initialState();
let scrollBySetlist = {};
let lastOpenerButton = null;
let dialogTargetKey = null;
let metronome = null;
/** Capo vigente en el escenario (manual o sugerido) y tono real que suena;
 *  la partitura muestra las formas para ese capo y los popovers lo usan. */
let stageCapo = 0;
let stageKeyRoot = "C";
let popoverTrigger = null;

/* ---- Almacenamiento de letras (defensivo) ---- */
const lyricsStore = (() => {
  let memory = {};
  let persistent = true;
  try {
    const raw = localStorage.getItem(LYRICS_STORAGE_KEY);
    memory = raw ? JSON.parse(raw) : {};
  } catch {
    persistent = false;
    memory = {};
  }
  const flush = () => {
    if (!persistent) return false;
    try {
      localStorage.setItem(LYRICS_STORAGE_KEY, JSON.stringify(memory));
      return true;
    } catch {
      persistent = false;
      return false;
    }
  };
  return {
    get: (key) => memory[key]?.text ?? null,
    has: (key) => key in memory,
    all: () => ({ ...memory }),
    set(key, text) {
      memory[key] = { text, updatedAt: new Date().toISOString() };
      return flush();
    },
    remove(key) {
      delete memory[key];
      return flush();
    },
    replaceAll(next) {
      memory = { ...next };
      return flush();
    },
    get persistent() { return persistent; }
  };
})();

function announce(message) {
  el.status.textContent = message;
}

function activeSetlist() {
  return setlists[state.activeSetlistIndex];
}
function selectedSong() {
  return activeSetlist().songs[state.selectedSongIndex];
}
function keyFor(song) {
  return appearanceKey(activeSetlist().id, song.id);
}
function transposeFor(song) {
  return state.transpositions[keyFor(song)] ?? 0;
}
function currentKey(song) {
  const semis = transposeFor(song);
  const idx = keyToPitchClass(song.assignedKey);
  if (idx === null) return song.assignedKey;
  const table = state.accidentalMode === "flat"
    ? ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"]
    : CHROMATIC;
  return table[((idx + semis) % 12 + 12) % 12];
}

/* ---- Render: pestañas ---- */
function renderTabs() {
  el.tablist.innerHTML = "";
  setlists.forEach((sl, index) => {
    const tab = document.createElement("button");
    tab.type = "button";
    tab.role = "tab";
    tab.id = `tab-${sl.id}`;
    tab.textContent = sl.shortLabel;
    tab.setAttribute("aria-controls", "tabpanel");
    const selected = index === state.activeSetlistIndex;
    tab.setAttribute("aria-selected", String(selected));
    tab.tabIndex = selected ? 0 : -1;
    tab.addEventListener("click", () => {
      state = selectSetlist(state, index);
      renderTabs();
      renderSetlist();
      tab.focus();
    });
    tab.addEventListener("keydown", (e) => onTabKeydown(e, index));
    el.tablist.appendChild(tab);
  });
}

function onTabKeydown(e, index) {
  let next = null;
  if (e.key === "ArrowRight") next = (index + 1) % setlists.length;
  else if (e.key === "ArrowLeft") next = (index - 1 + setlists.length) % setlists.length;
  else if (e.key === "Home") next = 0;
  else if (e.key === "End") next = setlists.length - 1;
  if (next === null) return;
  e.preventDefault();
  state = selectSetlist(state, next);
  renderTabs();
  renderSetlist();
  el.tablist.children[next].focus();
}

/* ---- Render: setlist ---- */
function renderSetlist() {
  el.cards.innerHTML = "";
  const sl = activeSetlist();
  sl.songs.forEach((song, index) => {
    const li = document.createElement("li");
    li.className = "card" + (index === state.selectedSongIndex ? " selected" : "");

    const row1 = document.createElement("div");
    row1.className = "row1";
    row1.innerHTML =
      `<span class="num">${index + 1}</span>` +
      `<span class="title"></span>`;
    row1.querySelector(".title").textContent = song.title;
    li.appendChild(row1);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = song.artist;
    li.appendChild(meta);

    const keys = document.createElement("div");
    keys.className = "keys";
    const semis = transposeFor(song);
    keys.innerHTML =
      `<span class="badge">Tono <span class="k">${song.assignedKey}</span></span>` +
      (semis !== 0 ? `<span class="badge">Sesión <span class="k">${currentKey(song)}</span></span>` : "");
    li.appendChild(keys);

    const actions = document.createElement("div");
    actions.className = "actions";

    const openBtn = document.createElement("button");
    openBtn.type = "button";
    openBtn.className = "primary";
    if (song.sourceStatus === "pending") {
      openBtn.textContent = "Partitura no disponible";
      openBtn.disabled = true;
    } else {
      openBtn.textContent = "Abrir partitura";
      openBtn.addEventListener("click", () => openStage(index, openBtn));
    }
    actions.appendChild(openBtn);

    const lyricBtn = document.createElement("button");
    lyricBtn.type = "button";
    lyricBtn.textContent = lyricsStore.has(keyFor(song)) ? "Editar letra" : "Agregar letra";
    lyricBtn.addEventListener("click", () => openLyricsDialog(keyFor(song), lyricBtn));
    actions.appendChild(lyricBtn);

    actions.appendChild(externalLink("Cifra Club", song.chartUrl));
    actions.appendChild(externalLink("Letra completa", song.lyricsUrl));
    actions.appendChild(externalLink("YouTube", song.youtubeUrl));

    li.appendChild(actions);
    el.cards.appendChild(li);
  });
}

function externalLink(label, url) {
  if (!url) {
    const span = document.createElement("span");
    span.className = "badge pending";
    span.textContent = `${label}: enlace no disponible`;
    return span;
  }
  const a = document.createElement("a");
  a.className = "badge";
  a.textContent = label;
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

/* ---- Stage ---- */
function openStage(index, opener) {
  scrollBySetlist[state.activeSetlistIndex] = window.scrollY;
  lastOpenerButton = opener ?? null;
  state = { ...selectSong(state, index), view: "stage" };
  renderStage();
  el.setlistView.hidden = true;
  el.stageView.hidden = false;
  window.scrollTo(0, 0);
}

function backToSetlist() {
  stopMetronome();
  destroyVideo();
  hideChordPopover();
  void exitStageFullscreen(); // el listado vive fuera de #stageView
  state = { ...state, view: "setlist" };
  el.stageView.hidden = true;
  el.setlistView.hidden = false;
  renderTabs();
  renderSetlist();
  window.scrollTo(0, scrollBySetlist[state.activeSetlistIndex] ?? 0);
  if (lastOpenerButton && document.contains(lastOpenerButton)) lastOpenerButton.focus();
}

function renderStage() {
  const song = selectedSong();
  const sl = activeSetlist();
  const semis = transposeFor(song);
  hideChordPopover();
  el.stageView.innerHTML = "";

  const toolbar = document.createElement("div");
  toolbar.className = "toolbar";
  const back = button("Volver al setlist", () => backToSetlist());
  const pos = document.createElement("span");
  pos.className = "position";
  pos.textContent = `${state.selectedSongIndex + 1} de ${sl.songs.length}`;
  const fs = button("Pantalla completa", toggleFullscreen);
  fs.id = "fullscreenBtn";
  // Alternar grilla de compases / recuadros sin salir del escenario.
  const isGrid = (state.chartLayout ?? "grid") === "grid";
  const layoutBtn = button(
    isGrid ? "Vista: grilla" : "Vista: lista",
    () => { state = { ...state, chartLayout: isGrid ? "flow" : "grid" }; renderStage(); },
    isGrid ? "Cambiar a vista de lista" : "Cambiar a vista de grilla de compases"
  );
  layoutBtn.setAttribute("aria-pressed", String(isGrid));
  toolbar.append(back, pos, layoutBtn, fs);
  el.stageView.appendChild(toolbar);

  const h2 = document.createElement("h2");
  h2.textContent = song.title;
  el.stageView.appendChild(h2);

  const artist = document.createElement("div");
  artist.className = "meta";
  artist.textContent = song.artist;
  el.stageView.appendChild(artist);

  // Enlaces externos de la canción (nueva pestaña; no se extrae contenido).
  const links = document.createElement("div");
  links.className = "actions";
  links.style.margin = "8px 0";
  links.appendChild(externalLink("Cifra Club", song.chartUrl));
  links.appendChild(externalLink("YouTube", song.youtubeUrl));
  el.stageView.appendChild(links);

  // Key line + transpose controls
  const keyline = document.createElement("div");
  keyline.className = "keyline";
  keyline.innerHTML =
    `<span class="badge">Asignada <span class="k">${song.assignedKey}</span></span>` +
    `<span class="badge">Actual <span class="k" id="currentKeyBadge">${currentKey(song)}</span></span>`;
  const controls = document.createElement("div");
  controls.className = "transpose-controls";
  controls.append(
    button("−½", () => applyTranspose(song, semis - 1), "Bajar medio tono"),
    button("+½", () => applyTranspose(song, semis + 1), "Subir medio tono"),
    keySelect(song),
    accidentalSelect(),
    button("Restablecer tono", () => applyTranspose(song, 0))
  );
  keyline.appendChild(controls);

  // Capo: sugerencia automática (práctica de worship: capo en vez de cejillas)
  // sobre los acordes que suenan con la transposición actual, o el capo fijado
  // a mano para esta aparición. Con capo, la partitura muestra las FORMAS que se
  // digitan; el grado (subíndice) es siempre el del tono real, invariante al capo.
  const transposed = song.sections.length
    ? transposeSections(song.sections, semis, state.accidentalMode)
    : [];
  const soundingChords = [...new Set(transposed.flatMap((s) => s.measures.flat()))];
  stageKeyRoot = currentKey(song);
  const suggestion = suggestCapo(stageKeyRoot, transposeChord, soundingChords);
  // Capo del arreglo de la banda (dato de la canción), válido sólo en el tono
  // original: si se transpone, el capo fijo dejaría de tener sentido.
  const arrangementCapo = semis === 0 && song.capo != null ? song.capo : null;
  const autoCapo = arrangementCapo ?? suggestion.capo;
  const autoRoot = shapeForCapo(stageKeyRoot, autoCapo, transposeChord);
  const override = state.capoOverrides?.[keyFor(song)];
  const manualCapo = override !== undefined && override !== null;
  stageCapo = manualCapo ? override : autoCapo;
  const shapeRoot = shapeForCapo(stageKeyRoot, stageCapo, transposeChord);

  const capoSelect = document.createElement("select");
  capoSelect.setAttribute("aria-label", "Capo");
  const autoOpt = document.createElement("option");
  autoOpt.value = "auto";
  autoOpt.textContent = autoCapo
    ? `Capo ${arrangementCapo != null ? "del arreglo" : "automático"} (${autoCapo}, en ${autoRoot})`
    : "Capo automático (sin capo)";
  capoSelect.appendChild(autoOpt);
  for (let c = 0; c <= 11; c++) {
    const opt = document.createElement("option");
    opt.value = String(c);
    opt.textContent = c === 0 ? "Sin capo" : `Capo ${c} · digitás en ${shapeForCapo(stageKeyRoot, c, transposeChord)}`;
    capoSelect.appendChild(opt);
  }
  capoSelect.value = manualCapo ? String(override) : "auto";
  capoSelect.addEventListener("change", () => {
    const v = capoSelect.value;
    state = setCapo(state, activeSetlist().id, song.id, v === "auto" ? null : Number(v));
    renderStage();
    announce(v === "auto" ? "Capo automático" : Number(v) ? `Capo ${v}: la partitura muestra las formas` : "Sin capo");
  });
  keyline.appendChild(capoSelect);

  const capoHint = document.createElement("span");
  capoHint.className = "badge capo-hint";
  if (manualCapo) {
    capoHint.textContent = stageCapo ? `Capo ${stageCapo} · digitás en ${shapeRoot} · suena en ${stageKeyRoot}` : "Sin capo";
  } else if (arrangementCapo != null) {
    capoHint.textContent = arrangementCapo
      ? `Capo ${arrangementCapo} (arreglo de la banda) · digitás en ${autoRoot} · suena en ${stageKeyRoot}`
      : "Sin capo (arreglo de la banda)";
  } else {
    capoHint.textContent = suggestion.capo
      ? `Capo sugerido: ${suggestion.capo} · digitás en ${suggestion.shapeRoot}${suggestion.barres === 0 ? " · sin cejillas" : ""}`
      : "Tonalidad abierta · sin capo";
  }
  keyline.appendChild(capoHint);
  el.stageView.appendChild(keyline);

  // Sections
  if (song.sections.length === 0) {
    const p = document.createElement("p");
    p.className = "pending";
    p.textContent = "Partitura no disponible.";
    el.stageView.appendChild(p);
  } else {
    // 1) Estructura: recorrido en orden con repeticiones e indicaciones.
    // 2) Bloques únicos: cada secuencia de acordes una sola vez, con todas las
    //    secciones que la usan. Con capo se leen las formas; el popover y el
    //    grado siempre parten del acorde real (sounding).
    const structure = songStructure(transposed);
    el.stageView.appendChild(renderRoadmap(structure));
    const ol = document.createElement("ol");
    ol.className = "sections";
    structure.blocks.forEach((block) => {
      const shapes = stageCapo
        ? transposeSections([{ measures: block.measures }], -stageCapo, "sharp")[0].measures
        : block.measures;
      const li = renderSection({ label: block.title, repeats: 1, measures: shapes }, { measures: block.measures }, stageKeyRoot);
      li.id = `block-${block.id}`;
      if (block.occurrences.length > 1) {
        const uses = document.createElement("span");
        uses.className = "uses";
        uses.textContent = `aparece ${block.occurrences.length} veces`;
        li.querySelector(".slabel")?.appendChild(uses);
      }
      ol.appendChild(li);
    });
    el.stageView.appendChild(ol);
  }

  el.stageView.appendChild(renderLyricsPanel(song));
  el.stageView.appendChild(renderVideoPanel(song));
  el.stageView.appendChild(renderMetronomePanel(song));

  // Prev / next
  const nav = document.createElement("div");
  nav.className = "nav-row";
  const prev = button("← Anterior", () => stepSong(-1));
  prev.disabled = state.selectedSongIndex === 0;
  const next = button("Siguiente →", () => stepSong(1));
  next.disabled = state.selectedSongIndex === sl.songs.length - 1;
  nav.append(prev, next);
  el.stageView.appendChild(nav);
}

/** Recorrido de la canción: "Contiene: …" + chips en orden que llevan a su bloque. */
function renderRoadmap(structure) {
  const wrap = document.createElement("section");
  wrap.className = "roadmap";
  wrap.setAttribute("aria-label", "Estructura de la canción");
  const h3 = document.createElement("h3");
  h3.textContent = "Estructura";
  wrap.appendChild(h3);
  const summary = document.createElement("p");
  summary.className = "hint";
  summary.textContent = `Contiene: ${structureSummary(structure.typeSummary)}`;
  wrap.appendChild(summary);

  const ol = document.createElement("ol");
  ol.className = "road";
  const reduced = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  structure.roadmap.forEach((step) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "step";
    b.textContent = step.displayLabel + (step.repeats > 1 ? ` ×${step.repeats}` : "");
    if (step.cue) {
      const c = document.createElement("span");
      c.className = "cue";
      c.textContent = step.cue;
      b.appendChild(c);
    }
    b.setAttribute("aria-label",
      `${step.displayLabel}${step.repeats > 1 ? `, ${step.repeats} veces` : ""}${step.cue ? `, ${step.cue}` : ""}: ir a sus acordes`);
    b.addEventListener("click", () => {
      const target = document.getElementById(`block-${step.blockId}`);
      if (!target) return;
      target.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
      target.classList.add("flash");
      setTimeout(() => target.classList.remove("flash"), 1200);
    });
    li.appendChild(b);
    ol.appendChild(li);
  });
  wrap.appendChild(ol);
  return wrap;
}

/**
 * @param section  sección a MOSTRAR (formas, si hay capo)
 * @param sounding misma sección con los acordes reales (para grado y popover)
 * @param keyRoot  tono real vigente, para el grado
 */
function renderSection(section, sounding = section, keyRoot = stageKeyRoot) {
  const li = document.createElement("li");
  li.className = "section";
  const label = document.createElement("div");
  label.className = "slabel";
  label.innerHTML = `<span></span>` + (section.repeats > 1 ? `<span class="repeats">× ${section.repeats}</span>` : "");
  label.querySelector("span").textContent = section.label;
  // Indicación de arreglo (instrumentación/dinámica) aportada por Darío; sin
  // dato, no se muestra nada. Sobrevive a transposición y capo (spread).
  if (section.cue) {
    const cue = document.createElement("span");
    cue.className = "cue";
    cue.textContent = section.cue;
    label.appendChild(cue);
  }
  li.appendChild(label);

  const grid = (state.chartLayout ?? "grid") === "grid";
  const measures = document.createElement("div");
  measures.className = grid ? "bars" : "measures";
  section.measures.forEach((measure, mi) => {
    const m = document.createElement("div");
    m.className = grid ? "bar" : "measure";
    // En la grilla cada compás reparte su ancho entre sus acordes: 1 = todo el
    // compás, 2 = mitad y mitad, 3–4 = por tiempo.
    if (grid) m.style.gridTemplateColumns = `repeat(${measure.length}, minmax(0, 1fr))`;
    measure.forEach((shape, ci) => {
      const real = sounding.measures[mi]?.[ci] ?? shape;
      const degree = chordToDegree(real, keyRoot);
      // Cada acorde es un botón: tap/clic muestra cómo digitarlo (sin hover).
      // Texto = forma a digitar; subíndice = grado del acorde real en el tono.
      const c = document.createElement("button");
      c.type = "button";
      c.className = "chord";
      c.textContent = shape;
      if (degree) {
        const sub = document.createElement("sub");
        sub.className = "deg";
        sub.textContent = degree;
        c.appendChild(sub);
      }
      const suena = shape !== real ? `, suena ${real}` : "";
      c.setAttribute("aria-label", `Acorde ${shape}${degree ? `, grado ${degree}` : ""}${suena}: ver cómo tocarlo`);
      c.setAttribute("aria-haspopup", "dialog");
      c.setAttribute("aria-expanded", "false");
      attachChordPopover(c, real);
      m.appendChild(c);
    });
    measures.appendChild(m);
  });
  li.appendChild(measures);
  return li;
}

function keySelect(song) {
  const select = document.createElement("select");
  select.setAttribute("aria-label", "Elegir tonalidad");
  const table = state.accidentalMode === "flat"
    ? ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"]
    : CHROMATIC;
  const assignedIdx = keyToPitchClass(song.assignedKey);
  table.forEach((name, idx) => {
    const opt = document.createElement("option");
    opt.value = String(idx);
    opt.textContent = name;
    if (assignedIdx !== null && ((assignedIdx + transposeFor(song)) % 12 + 12) % 12 === idx) {
      opt.selected = true;
    }
    select.appendChild(opt);
  });
  select.addEventListener("change", () => {
    const targetIdx = Number(select.value);
    const assigned = keyToPitchClass(song.assignedKey);
    let semis = ((targetIdx - assigned) % 12 + 12) % 12;
    if (semis > 6) semis -= 12;
    applyTranspose(song, semis);
  });
  return select;
}

function accidentalSelect() {
  const select = document.createElement("select");
  select.setAttribute("aria-label", "Bemoles o sostenidos");
  [["sharp", "Sostenidos (♯)"], ["flat", "Bemoles (♭)"]].forEach(([value, text]) => {
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = text;
    if (state.accidentalMode === value) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => {
    state = { ...state, accidentalMode: select.value };
    renderStage();
  });
  return select;
}

function applyTranspose(song, semitones) {
  state = setTranspose(state, activeSetlist().id, song.id, semitones);
  renderStage();
  announce(`Tonalidad actual: ${currentKey(song)}`);
}

function stepSong(delta) {
  stopMetronome();
  destroyVideo();
  state = moveSong(state, delta);
  renderStage();
  window.scrollTo(0, 0);
}

function exportLyrics() {
  const json = serializeLyricsBackup(lyricsStore.all());
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `worship-setlist-lyrics-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  announce("Respaldo de letras exportado");
}

function importLyrics(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const parsed = parseLyricsBackup(String(reader.result ?? ""), allAppearanceKeys());
    if (Object.keys(parsed.lyrics).length === 0) {
      announce("No se importaron letras válidas");
      return;
    }
    const { merged, collisions } = mergeLyrics(lyricsStore.all(), parsed.lyrics);
    if (collisions.length && !confirm(`Se sobrescribirán ${collisions.length} letra(s) existente(s). ¿Continuar?`)) {
      // Import only non-colliding entries.
      const safe = { ...lyricsStore.all() };
      for (const [k, v] of Object.entries(parsed.lyrics)) if (!(k in safe)) safe[k] = v;
      lyricsStore.replaceAll(safe);
    } else {
      lyricsStore.replaceAll(merged);
    }
    if (state.view === "stage") renderStage(); else renderSetlist();
    announce(`Letras importadas${parsed.errors.length ? ` (${parsed.errors.length} omitidas)` : ""}`);
  };
  reader.readAsText(file, "utf-8");
  input.value = "";
}

/* ---- Metronome ---- */
class MetronomeController {
  constructor() {
    this.ctx = null;
    this.timer = null;
    this.nextTime = 0;
    this.beat = 0;
    this.bpm = 120;
    this.meter = 4;
    this.volume = 0.6;
    this.muted = false;
    this.onBeat = null;
    this._running = false;
  }
  get running() { return this._running; }
  start({ bpm, beatsPerMeasure, volume, onBeat }) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) throw new Error("Web Audio API unavailable");
    if (!this.ctx) this.ctx = new Ctx();
    this.bpm = clampBpm(bpm);
    this.meter = normalizeMeter(beatsPerMeasure);
    if (typeof volume === "number") this.volume = volume;
    this.onBeat = onBeat ?? null;
    this.beat = -1;
    this.nextTime = this.ctx.currentTime + 0.1;
    this._running = true;
    this.timer = setInterval(() => this._schedule(), 25);
  }
  _schedule() {
    if (!this.ctx) return;
    while (this.nextTime < this.ctx.currentTime + 0.1) {
      const { beat, accented } = advanceBeat(this.beat, this.meter);
      this.beat = beat;
      this._click(this.nextTime, accented);
      if (this.onBeat) this.onBeat(beat, accented);
      this.nextTime += secondsPerBeat(this.bpm);
    }
  }
  _click(time, accented) {
    if (this.muted || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.frequency.value = accented ? 1200 : 800;
    gain.gain.setValueAtTime(this.volume, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(time);
    osc.stop(time + 0.03);
  }
  stop() {
    this._running = false;
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  }
  setBpm(bpm) { this.bpm = clampBpm(bpm); }
  setMeter(m) { this.meter = normalizeMeter(m); }
  setVolume(v) { this.volume = Math.max(0, Math.min(1, v)); }
  setMuted(m) { this.muted = !!m; }
}

    meterSelect, startBtn, volumeInput, muteBtn

  panel.appendChild(controls);
  return panel;

function startMetronome(bpm, meter, volume, muted) {
  try {
    if (!metronome) metronome = new MetronomeController();
    metronome.setMuted(muted);
    metronome.start({ bpm, beatsPerMeasure: meter, volume });
    state = { ...state, metronomeRunning: true };
  } catch {
    announce("Metrónomo no disponible");
  }
}
function stopMetronome() {
  if (metronome?.running) {
    metronome.stop();
    state = { ...state, metronomeRunning: false };
  }
}

/* ---- Pantalla completa ----
   Fullscreen API sobre #stageView; si el navegador no la ofrece o la rechaza
   (p. ej. Safari en iPhone), modo "pseudo" equivalente: overlay fijo con scroll
   propio y Escape para salir. En ambos casos #stageView es el contenedor con
   scroll y el popover se mueve adentro (fuera del elemento no se vería). */
const PSEUDO_FS = "pseudo-fullscreen";

function isStageFullscreen() {
  return document.fullscreenElement === el.stageView
    || document.webkitFullscreenElement === el.stageView
    || el.stageView.classList.contains(PSEUDO_FS);
}

function updateFullscreenButton() {
  const btn = document.getElementById("fullscreenBtn");
  if (btn) btn.textContent = isStageFullscreen() ? "Salir de pantalla completa" : "Pantalla completa";
}

function setPseudoFullscreen(on) {
  el.stageView.classList.toggle(PSEUDO_FS, on);
  document.body.classList.toggle("pseudo-fullscreen-open", on);
  hideChordPopover();
  updateFullscreenButton();
  if (on) announce("Pantalla completa. Escape o el botón para salir.");
}

async function toggleFullscreen() {
  if (isStageFullscreen()) {
    await exitStageFullscreen();
    return;
  }
  try {
    if (el.stageView.requestFullscreen) await el.stageView.requestFullscreen();
    else if (el.stageView.webkitRequestFullscreen) el.stageView.webkitRequestFullscreen();
    else setPseudoFullscreen(true);
  } catch {
    setPseudoFullscreen(true); // sin API o solicitud rechazada: modo pseudo
  }
}

async function exitStageFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  } catch { /* nada que salir */ }
  if (el.stageView.classList.contains(PSEUDO_FS)) setPseudoFullscreen(false);
}

for (const ev of ["fullscreenchange", "webkitfullscreenchange"]) {
  document.addEventListener(ev, () => {
    hideChordPopover(); // las coordenadas cambian con el modo
    updateFullscreenButton();
  });
}

/* ---- Popover de digitación: sólo por tap/clic (sin hover ni foco) ----
   Decisión de Darío: en escenario el popover no debe aparecer al mover el
   puntero. Con teclado, Enter/Espacio sobre el acorde disparan el clic. */
function attachChordPopover(btn, chord) {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (popoverTrigger === btn) hideChordPopover(); // segundo tap: cierra
    else showChordPopover(btn, chord);
  });
}

function showChordPopover(btn, chord) {
  if (popoverTrigger && popoverTrigger !== btn) popoverTrigger.setAttribute("aria-expanded", "false");
  popoverTrigger = btn;
  btn.setAttribute("aria-expanded", "true");
  el.popover.replaceChildren(...buildChordPopoverContent(chord));
  el.popover.hidden = false;
  positionPopover(btn);
}

function hideChordPopover() {
  el.popover.hidden = true;
  if (popoverTrigger) popoverTrigger.setAttribute("aria-expanded", "false");
  popoverTrigger = null;
}

function positionPopover(btn) {
  const pop = el.popover;
  const r = btn.getBoundingClientRect();
  const width = pop.offsetWidth || 240;
  const inStage = isStageFullscreen();
  // En pantalla completa el popover debe vivir DENTRO de #stageView (lo que
  // queda fuera del elemento fullscreen no se ve) y posicionarse relativo a
  // él, que es fijo y tiene su propio scroll.
  const container = inStage ? el.stageView : document.body;
  if (pop.parentElement !== container) container.appendChild(pop);
  if (inStage) {
    const s = el.stageView.getBoundingClientRect();
    const maxLeft = el.stageView.clientWidth - width - 8;
    let left = r.left - s.left + el.stageView.scrollLeft + r.width / 2 - width / 2;
    left = Math.max(8, Math.min(left, maxLeft));
    pop.style.left = `${left}px`;
    pop.style.top = `${r.bottom - s.top + el.stageView.scrollTop + 8}px`;
  } else {
    const viewport = document.documentElement.clientWidth;
    let left = r.left + window.scrollX + r.width / 2 - width / 2;
    left = Math.max(window.scrollX + 8, Math.min(left, window.scrollX + viewport - width - 8));
    pop.style.left = `${left}px`;
    pop.style.top = `${r.bottom + window.scrollY + 8}px`;
  }
}

document.addEventListener("click", (e) => {
  if (!el.popover.hidden && !el.popover.contains(e.target)) hideChordPopover();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!el.popover.hidden) {
    const trigger = popoverTrigger;
    hideChordPopover();
    trigger?.focus();
  } else if (el.stageView.classList.contains("pseudo-fullscreen")) {
    setPseudoFullscreen(false); // Escape sale del modo pseudo (la API real ya lo hace sola)
  }
});

function buildChordPopoverContent(sounding) {
  const title = document.createElement("h4");
  title.id = "chordPopoverTitle";
  const cap = document.createElement("p");
  cap.className = "cap";
  const nodes = [title, cap];

  if (sounding === "N.C.") {
    title.textContent = "N.C.";
    cap.textContent = "Sin acorde.";
    return nodes;
  }

  const shape = shapeForCapo(sounding, stageCapo, transposeChord);
  const degree = chordToDegree(sounding, stageKeyRoot);
  const grado = degree ? ` · grado ${degree}` : "";
  title.textContent = shape;
  cap.textContent = stageCapo
    ? `Con capo ${stageCapo}: digitás ${shape}, suena ${sounding}${grado}.`
    : `Sin capo${grado}.`;

  const v = findVoicing(shape);
  if (!v) {
    const p = document.createElement("p");
    p.className = "pending";
    p.textContent = "Digitación no disponible.";
    nodes.push(p);
    return nodes;
  }
  nodes.push(renderChordDiagram(v));
  const frets = document.createElement("p");
  frets.className = "frets";
  frets.textContent = `Trastes (grave → agudo): ${v.frets.join(" ")}`;
  nodes.push(frets);
  if (v.note) {
    const n = document.createElement("p");
    n.className = "cap";
    n.textContent = v.note;
    nodes.push(n);
  }
  return nodes;
}

/** Diagrama de acorde en SVG: 6 cuerdas (grave a la izquierda), 5 trastes. */
function renderChordDiagram(v) {
  const NS = "http://www.w3.org/2000/svg";
  const fretted = v.frets.filter((f) => f !== "x" && f > 0);
  const maxFret = fretted.length ? Math.max(...fretted) : 0;
  const baseFret = maxFret > 4 ? Math.min(...fretted) : 1;
  const W = 200, H = 220, left = 34, top = 40, sx = 27, sy = 30;

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Diagrama de ${v.symbol}. Trastes grave a agudo: ${v.frets.join(", ")}.`);
  const mk = (tag, attrs, text) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, val] of Object.entries(attrs)) node.setAttribute(k, val);
    if (text != null) node.textContent = text;
    svg.appendChild(node);
    return node;
  };

  for (let s = 0; s < 6; s++) {
    mk("line", { x1: left + s * sx, y1: top, x2: left + s * sx, y2: top + 5 * sy, stroke: "#9aa3b2", "stroke-width": 1 });
  }
  for (let f = 0; f <= 5; f++) {
    const nut = f === 0 && baseFret === 1;
    mk("line", { x1: left, y1: top + f * sy, x2: left + 5 * sx, y2: top + f * sy, stroke: nut ? "#f3f4f6" : "#9aa3b2", "stroke-width": nut ? 5 : 1 });
  }
  if (baseFret > 1) {
    mk("text", { x: left - 20, y: top + sy * 0.65, fill: "#9aa3b2", "font-size": 12, "text-anchor": "middle" }, `${baseFret}`);
  }
  if (v.barre) {
    const row = v.barre.fret - baseFret + 1;
    mk("rect", {
      x: left + v.barre.from * sx - 9, y: top + (row - 0.5) * sy - 9,
      width: (v.barre.to - v.barre.from) * sx + 18, height: 18, rx: 9, fill: "#e7b45a"
    });
  }
  v.frets.forEach((f, s) => {
    const x = left + s * sx;
    if (f === "x") {
      mk("text", { x, y: top - 12, fill: "#f2777a", "font-size": 15, "text-anchor": "middle", "font-weight": 700 }, "×");
    } else if (f === 0) {
      mk("circle", { cx: x, cy: top - 16, r: 5, fill: "none", stroke: "#f3f4f6", "stroke-width": 1.5 });
    } else {
      const y = top + (f - baseFret + 0.5) * sy;
      mk("circle", { cx: x, cy: y, r: 10, fill: "#e7b45a" });
      const finger = v.fingers[s];
      if (finger) mk("text", { x, y: y + 4, fill: "#14161b", "font-size": 12, "text-anchor": "middle", "font-weight": 700 }, String(finger));
    }
  });
  return svg;
}

/* ---- Helpers ---- */
function button(label, onClick, ariaLabel) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  if (ariaLabel) b.setAttribute("aria-label", ariaLabel);
  b.addEventListener("click", onClick);
  return b;
}

window.addEventListener("pagehide", stopMetronome);

/* ---- Boot ---- */
renderTabs();
renderSetlist();
    </script>
  </body>
</html>
