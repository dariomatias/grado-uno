<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Setlist de Worship — Transponible</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1f232c;
        --text: #f3f4f6;
        --muted: #9aa3b2;
        --gold: #e7b45a;
        --gold-strong: #f4c777;
        --error: #f2777a;
        --ok: #7ac77a;
        --border: #2a2f3a;
        --focus: #8ab4ff;
        --radius: 12px;
        --group-a: #e7b45a;
        --group-b: #7eb6ff;
        --group-c: #f08a9a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .skip-link {
        position: absolute; left: -999px; top: 0;
        background: var(--gold); color: #111; padding: 10px 14px; border-radius: 0 0 8px 0;
        z-index: 100;
      }
      .skip-link:focus { left: 0; }
      a { color: var(--gold-strong); }
      button, select, input, textarea {
        font: inherit; color: inherit;
      }
      button {
        background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        border-radius: 10px; padding: 10px 14px; cursor: pointer;
        min-height: 44px;
      }
      button:hover { border-color: var(--gold); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.primary { background: var(--gold); color: #14161b; border-color: var(--gold); font-weight: 700; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      [hidden] { display: none !important; }
      header.app {
        padding: 14px 16px; border-bottom: 1px solid var(--border);
        display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      }
      header.app h1 { font-size: 1.15rem; margin: 0; }
      header.app p { margin: 0; color: var(--muted); font-size: .85rem; }
      main { padding: 16px; max-width: 1100px; margin: 0 auto; }
      #statusMessage {
        position: fixed; bottom: 0; left: 0; right: 0; margin: 0;
        background: var(--panel); border-top: 1px solid var(--border);
        color: var(--gold-strong); padding: 8px 16px; font-size: .9rem; min-height: 1.5rem;
        text-align: center; z-index: 40;
      }
      #statusMessage:empty { display: none; }

      .meeting-picker {
        display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-weight: 600;
      }
      .datepick { position: relative; flex: 1 1 280px; max-width: 320px; }
      #meetingSelect {
        width: 100%; text-align: left; background: var(--panel-2);
        padding-right: 36px; position: relative;
      }
      #meetingSelect::after {
        content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted);
      }
      #meetingSelect[aria-expanded="true"] { border-color: var(--gold); }
      .datepick-pop {
        position: absolute; z-index: 35; left: 0; top: calc(100% + 6px);
        width: min(100vw - 32px, 340px);
        background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 12px; box-shadow: 0 16px 36px rgba(0, 0, 0, .45);
        max-height: min(70vh, 640px); overflow: auto;
      }
      .datepick-legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .datepick-legend .swatch, .datepick-when .swatch {
        display: inline-flex; align-items: center; gap: 6px;
        border-radius: 999px; padding: 4px 10px; font-size: .85rem; font-weight: 700;
        border: 1px solid transparent;
      }
      .swatch.group-a { color: var(--group-a); background: color-mix(in srgb, var(--group-a) 18%, transparent); border-color: color-mix(in srgb, var(--group-a) 45%, transparent); }
      .swatch.group-b { color: var(--group-b); background: color-mix(in srgb, var(--group-b) 18%, transparent); border-color: color-mix(in srgb, var(--group-b) 45%, transparent); }
      .swatch.group-c { color: var(--group-c); background: color-mix(in srgb, var(--group-c) 18%, transparent); border-color: color-mix(in srgb, var(--group-c) 45%, transparent); }
      .datepick-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .datepick-nav button { min-width: 44px; padding: 8px; }
      .datepick-nav span { font-weight: 700; }
      .datepick-week, .datepick-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .datepick-week { color: var(--muted); font-size: .75rem; text-align: center; margin-bottom: 4px; }
      .datepick-days .pad { min-height: 44px; }
      .datepick-days .day {
        min-width: 0; min-height: 48px; padding: 4px 2px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0; line-height: 1.1;
      }
      .datepick-days .day .g { font-size: .68rem; font-weight: 800; }
      .datepick-days .day.group-a { color: var(--group-a); background: color-mix(in srgb, var(--group-a) 22%, transparent); border-color: color-mix(in srgb, var(--group-a) 55%, transparent); }
      .datepick-days .day.group-b { color: var(--group-b); background: color-mix(in srgb, var(--group-b) 22%, transparent); border-color: color-mix(in srgb, var(--group-b) 55%, transparent); }
      .datepick-days .day.group-c { color: var(--group-c); background: color-mix(in srgb, var(--group-c) 22%, transparent); border-color: color-mix(in srgb, var(--group-c) 55%, transparent); }
      .datepick-days .day[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }
      .datepick-when { display: grid; gap: 6px; margin-top: 10px; }
      .datepick-when p { margin: 0; display: flex; gap: 8px; align-items: baseline; font-size: .9rem; font-weight: 600; }
      .datepick-extra { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .datepick-extra .group-a { color: var(--group-a); border-color: color-mix(in srgb, var(--group-a) 55%, transparent); }
      .datepick-extra .group-b { color: var(--group-b); border-color: color-mix(in srgb, var(--group-b) 55%, transparent); }
      .datepick-extra .group-c { color: var(--group-c); border-color: color-mix(in srgb, var(--group-c) 55%, transparent); }
      .datepick-days .pad { color: var(--muted); display: grid; place-items: center; font-size: .9rem; }
      .datepick-home[aria-pressed="true"] { border-color: var(--gold); }

      /* Setlist cards */
      .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      @media (min-width: 1100px) { .cards { grid-template-columns: 1fr 1fr; } }
      .cards.setlist { grid-template-columns: 1fr; }
      .card {
        background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 14px; display: flex; flex-direction: column; gap: 8px;
      }
      .card.selected { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
      .card .row1 { display: flex; align-items: center; gap: 10px; }
      .card .num {
        font-variant-numeric: tabular-nums; color: var(--gold-strong); font-weight: 700;
        min-width: 1.5em;
      }
      .card .move { margin-left: auto; cursor: grab; touch-action: none; }
      .card .move:active { cursor: grabbing; }
      .cards.setlist > .card { transition: transform 180ms ease; }
      .card.lifting {
        position: fixed; z-index: 50; margin: 0; pointer-events: none;
        box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
        transform: scale(1.02);
        transition: none;
      }
      .card.placeholder {
        border-style: dashed; background: transparent; box-shadow: none;
        pointer-events: none;
      }
      .card .title { font-size: 1.05rem; font-weight: 600; }
      .card .meta { color: var(--muted); font-size: .85rem; }
      .card .keys { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
        padding: 4px 8px; font-size: .85rem;
      }
      .badge .k { color: var(--gold-strong); font-weight: 700; }
      .card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .card .appearances, .card .assign { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .menu { position: relative; }
      .menu > summary {
        position: relative; list-style: none; cursor: pointer; min-height: 44px; padding: 10px 36px 10px 14px;
        border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2);
      }
      .menu > summary::-webkit-details-marker { display: none; }
      .menu > summary::after {
        content: "▾"; position: absolute; right: 12px; top: 10px; color: var(--muted);
      }
      .menu[open] > summary { border-color: var(--gold); }
      .menu .panel {
        position: absolute; z-index: 30; left: 0; top: calc(100% + 4px);
        min-width: 100%; max-height: 240px; overflow: auto;
        background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
        padding: 6px; box-shadow: 0 12px 28px rgba(0, 0, 0, .35);
      }
      .menu .panel label {
        display: flex; gap: 8px; align-items: center; min-height: 36px; padding: 4px 8px; cursor: pointer;
      }
      button.badge { cursor: pointer; color: inherit; font: inherit; font-size: .85rem; min-height: 36px; }
      button.badge[disabled] { cursor: default; opacity: .6; }
      .chip {
        display: inline-flex; align-items: center; gap: 4px;
        background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
        padding: 2px 4px 2px 10px; font-size: .85rem; min-height: 36px;
      }
      .chip.quiet { padding-right: 10px; color: var(--muted); }
      .chip button {
        min-height: 28px; min-width: 28px; padding: 0 6px; border-radius: 999px;
      }

      /* Home: índice de todas las canciones con búsqueda y filtros */
      .home-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      .home-controls input[type="search"] {
        flex: 1 1 220px; min-height: 44px; padding: 10px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--panel-2); color: inherit; font: inherit;
      }
      .home-count { color: var(--muted); font-size: .85rem; }
      .home-empty { color: var(--muted); padding: 16px; }
      .pending { color: var(--muted); font-style: italic; }

      /* Stage */
      #stageView .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      #stageView .position { color: var(--muted); font-variant-numeric: tabular-nums; }
      #stageView h2 { margin: 4px 0; font-size: clamp(1.3rem, 4vw, 2rem); }
      .keyline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
      .transpose-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      /* Estructura: recorrido de la canción con chips que llevan a cada bloque */
      .roadmap {
        background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius);
        padding: 12px; margin: 12px 0;
      }
      .roadmap h3 { margin: 0 0 4px; font-size: 1rem; color: var(--gold-strong); }
      .roadmap .hint { margin: 0 0 8px; }
      .road { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; }
      .road li { display: flex; align-items: center; gap: 4px; }
      .road li + li::before { content: "→"; color: var(--muted); font-size: .9rem; }
      .road .step {
        min-height: 44px; padding: 6px 12px; border-radius: 999px; font-size: .95rem;
        background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
        display: inline-flex; align-items: center; gap: 6px;
      }
      .road .step .cue { margin-left: 0; font-size: .72rem; }
      .section .uses { color: var(--muted); font-size: .85rem; font-weight: 400; }
      .section.flash { outline: 3px solid var(--gold); outline-offset: 2px; transition: outline-color .8s ease; }
      @media (prefers-reduced-motion: reduce) { .section.flash { transition: none; } }
      .sections { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 14px; }
      .section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
      .section .slabel { color: var(--gold-strong); font-weight: 700; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
      .section .repeats { color: var(--muted); font-size: .85rem; }
      /* Vuelta repetida dentro de la sección: los compases una vez y el ×N al lado. */
      .pattern { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .slabel + .pattern { margin-top: 0; }
      .pattern-body { flex: 1; min-width: 0; }
      .pattern .repeats { color: var(--gold-strong); font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
      /* Indicación de arreglo por sección (p. ej. "entra acústica"), dato de Darío */
      .section .cue {
        margin-left: auto; font-size: .8rem; font-weight: 600;
        color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 999px; padding: 2px 10px; white-space: nowrap;
      }
      /* Filas de compases (pedido de Darío, 2026-09-22): cada sección se corta en
         líneas de N compases (2, 4 u 8 según la canción) y una línea NUNCA
         continúa en la de abajo. Cada fila es su propio contenedor; una fila
         incompleta conserva el ancho de columna de las demás. */
      .measures { display: flex; flex-wrap: nowrap; gap: 8px; }
      .measures + .measures { margin-top: 8px; }
      .measures .measure { flex: 1 1 0; min-width: 0; justify-content: center; }
      .measures .measure.filler { visibility: hidden; }
      /* Grilla de compases: N por fila, ancho fijo, barras como separadores.
         Cada compás reparte su ancho entre sus acordes (tiempos parejos). */
      .bars {
        display: grid; grid-template-columns: repeat(var(--per-line, 4), minmax(0, 1fr));
        border-top: 1px solid var(--border);
      }
      .bars + .bars { border-top: 0; }
      .bar {
        display: grid; align-items: center; gap: 2px; min-height: 56px;
        padding: 4px 4px 4px 6px;
        border-left: 2px solid var(--muted); border-bottom: 1px solid var(--border);
      }
      .bar:last-child { border-right: 2px solid var(--muted); }
      .bar .chord {
        min-width: 0; justify-self: start; padding: 4px 6px;
        font-size: clamp(1rem, 3.4vw, 1.45rem); line-height: 1.1;
      }
      @media (max-width: 360px) { .bar .chord { font-size: .95rem; padding: 4px 3px; } }
      .measure {
        display: flex; gap: 8px; align-items: center;
        border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
        font-size: clamp(1.1rem, 3.5vw, 1.6rem); font-weight: 700;
      }
      /* Acordes como botones: hover o tap muestran la digitación */
      .chord {
        background: none; border: 1px solid transparent; border-radius: 8px;
        padding: 6px 10px; min-height: 44px; min-width: 44px;
        color: var(--gold-strong); font: inherit; font-weight: 700; cursor: pointer;
      }
      .chord:hover, .chord:focus-visible, .chord[aria-expanded="true"] {
        border-color: var(--gold); background: var(--panel-2);
      }
      .capo-hint { color: var(--gold-strong); }
      /* Grado de la escala como subíndice de cada acorde */
      .chord sub.deg {
        font-size: .55em; line-height: 1; margin-left: 2px;
        color: var(--muted); font-weight: 600; vertical-align: sub;
      }
      #chordPopover {
        position: absolute; z-index: 60; width: 240px;
        background: var(--panel); border: 1px solid var(--gold); border-radius: 12px;
        padding: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, .55);
      }
      #chordPopover h4 { margin: 0 0 2px; font-size: 1.2rem; color: var(--gold-strong); }
      #chordPopover .cap { color: var(--muted); font-size: .85rem; margin: 0 0 8px; }
      #chordPopover svg { display: block; width: 100%; height: auto; }
      #chordPopover .frets { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
      .panel {
        background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 12px; margin: 12px 0;
      }
      .panel h3 { margin: 0 0 8px; font-size: 1rem; }
      .lyrics-text { white-space: pre-wrap; font-size: 1rem; line-height: 1.6; }
      .nav-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
      .metronome-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .metronome-controls input[type="number"] { width: 5em; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); min-height: 44px; }
      .metronome-controls input[type="range"] { min-height: 44px; }
      dialog {
        background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: var(--radius); max-width: 640px; width: calc(100% - 32px); padding: 16px;
      }
      dialog::backdrop { background: rgba(0,0,0,.6); }
      dialog textarea { width: 100%; min-height: 200px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
      .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
      .hint { color: var(--muted); font-size: .85rem; }
      .err { color: var(--error); }
      select { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; min-height: 44px; }
      #youtubeContainer iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
      /* Pantalla completa (Fullscreen API o modo pseudo para navegadores sin
         API, como Safari en iPhone): #stageView ocupa la pantalla y SCROLLEA
         por sí mismo. Sin overflow propio el contenido quedaba recortado. */
      #stageView:fullscreen,
      #stageView:-webkit-full-screen,
      #stageView.pseudo-fullscreen {
        position: fixed; inset: 0; width: 100%; height: 100%; z-index: 45;
        overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
        background: var(--bg); color: var(--text); box-sizing: border-box;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                 max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      body.pseudo-fullscreen-open { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Saltar al contenido</a>
    <header class="app">
      <h1>Setlist de Worship</h1>
      <p>Lista general · por fecha · acordes transponibles · letras locales</p>
    </header>

    <main id="mainContent">
      <section id="setlistView" aria-label="Listado de canciones por reunión">
        <div class="meeting-picker">
          <span>Fecha</span>
          <div class="datepick">
            <button type="button" id="meetingSelect" aria-label="Elegir fecha" aria-haspopup="dialog" aria-expanded="false" aria-controls="datePicker">Home</button>
            <div id="datePicker" class="datepick-pop" role="dialog" aria-label="Calendario de reuniones" hidden>
              <div class="datepick-legend" id="datePickerLegend"></div>
              <div class="datepick-nav">
                <button type="button" id="datePrev" aria-label="Mes anterior">‹</button>
                <span id="dateMonth"></span>
                <button type="button" id="dateNext" aria-label="Mes siguiente">›</button>
              </div>
              <div class="datepick-week" aria-hidden="true"><span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span></div>
              <div class="datepick-days" id="dateGrid"></div>
              <div class="datepick-when" id="dateWhen"></div>
              <div class="datepick-extra" id="dateExtra"></div>
            </div>
          </div>
        </div>
        <div id="tabpanel">
          <ol class="cards" id="songCards"></ol>
        </div>
      </section>

      <section id="stageView" hidden aria-label="Visor de escenario"></section>
    </main>

    <p id="statusMessage" aria-live="polite" role="status"></p>

    <!-- Popover de digitación: se llena al tocar/clic sobre un acorde (sin hover) -->
    <div id="chordPopover" role="dialog" aria-labelledby="chordPopoverTitle" hidden></div>

    <dialog id="lyricsDialog" aria-labelledby="lyricsDialogTitle">
      <h3 id="lyricsDialogTitle">Letra de la canción</h3>
      <p class="hint" id="lyricsDialogHint">
        Pegá una letra que hayas aportado o para la que tengas autorización, o cargá un archivo .txt (UTF-8, máx. 200 KiB).
      </p>
      <textarea id="lyricsTextarea" aria-describedby="lyricsDialogHint lyricsDialogError"></textarea>
      <p id="lyricsDialogError" class="err" role="alert"></p>
      <div class="dialog-actions">
        <label class="badge">
          Cargar .txt
          <input type="file" id="lyricsFile" accept=".txt,text/plain" style="max-width: 12em;" />
        </label>
        <button type="button" id="lyricsCancel">Cancelar</button>
        <button type="button" class="primary" id="lyricsSave">Guardar</button>
      </div>
    </dialog>

    <script type="module">
/* content-module:start */
// Coro de "Todo es posible" (chart oficial Bethel, Bb → D). Se reutiliza en
// cada aparición del coro dentro del orden de ejecución.
const TODO_ES_POSIBLE_CORO = [["G"], ["D", "A"], ["G"], ["D", "A"], ["G"], ["Bm", "D"], ["G"], ["D", "A", "D"]];
const TODO_ES_POSIBLE_VERSO = [["D"], ["D/F#", "G"], ["D"], ["D/F#", "G"], ["Bm", "A"], ["D/F#", "G"], ["D"]];

// "A Jesús seguiré" (TWICE, chart en G): bloques que se repiten en el orden
// de ejecución. Sólo acordes.
const A_JESUS_CORO = [["G"], ["D", "A"], ["G"], ["D", "A"], ["G", "D", "A"]];
const A_JESUS_PRECORO = [["G"], ["D", "A"], ["G", "D", "A"]];
const A_JESUS_TAG = [["G", "D", "A"]];

function datedLabel(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function emptyDatedMeeting(iso) {
  const label = datedLabel(iso);
  return { id: iso, label, shortLabel: label, date: iso, lineup: [], songs: [] };
}

/** Octubre 2026: viernes, sábado y domingo son fechas elegibles, aunque no tengan canciones. */
function insertOctoberWeekends(list) {
  const extras = [];
  for (let day = 1; day <= 31; day++) {
    const weekday = new Date(Date.UTC(2026, 9, day)).getUTCDay();
    if (weekday !== 0 && weekday !== 5 && weekday !== 6) continue;
    const id = `2026-10-${String(day).padStart(2, "0")}`;
    if (list.some((meeting) => meeting.id === id)) continue;
    extras.push(emptyDatedMeeting(id));
  }
  const ensayo = list.filter((meeting) => meeting.general);
  const dated = [...list.filter((meeting) => !meeting.general), ...extras]
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
  return [...dated, ...ensayo];
}

/**
 * Fábrica de canción. La canción es el objeto: letra (`lyrics`), acordes en la
 * nota en que está escrita (`sections`) y etiquetas de fecha (`dates`, ids de
 * reunión). `dates` vacío = sólo en la lista general. Varios ids = la misma
 * canción en varias fechas. La letra no se precarga en el fuente.
 */
function song(id, title, assignedKey, overrides = {}) {
  const base = {
    id,
    title,
    artist: "Versión por confirmar",
    assignedKey,
    sourceKey: null,
    sourceStatus: "pending",
    lyrics: null,
    dates: [],
    groups: ["A"], // todas arrancan en A; pueden sumarse B y C
    lyricsUrl: null,
    chartUrl: null, // enlace externo a la cifra/tablatura (Cifra Club); no se extrae contenido
    youtubeUrl: null,
    youtubeVideoId: null,
    tempoBpm: null,
    beatsPerMeasure: 4,
    capo: null, // capo con el que la banda toca la canción (dato del arreglo); null = sugerido
    barsPerLine: 4, // compases por línea en el escenario (2, 4 u 8), según la canción
    sections: []
  };
  const merged = { ...base, ...overrides };
  // Una fuente con acordes capturados se considera confirmada.
  if (merged.sections.length > 0) merged.sourceStatus = "confirmed";
  if (!Array.isArray(merged.dates)) merged.dates = [];
  return merged;
}

function asDateTags(raw, meetingId) {
  if (raw.dates.length) {
    return raw.dates.map((d) => (typeof d === "string" ? { id: d, key: raw.assignedKey } : { ...d }));
  }
  return meetingId ? [{ id: meetingId, key: raw.assignedKey }] : [];
}

/** Una canción, varias fechas. Cada etiqueta guarda el tono de esa reunión. */
function indexSongs(meetingList, extras = []) {
  const byId = new Map();
  const list = [];
  const add = (raw, tags) => {
    const existing = byId.get(raw.id);
    if (!existing) {
      const next = { ...raw, chartKey: raw.assignedKey, dates: tags.map((t) => ({ ...t })) };
      byId.set(raw.id, next);
      list.push(next);
      return;
    }
    for (const tag of tags) {
      if (!existing.dates.some((d) => d.id === tag.id)) existing.dates.push({ ...tag });
    }
  };
  for (const meeting of meetingList) {
    for (const raw of meeting.songs) add(raw, asDateTags(raw, meeting.id));
  }
  for (const extra of extras) {
    if (byId.has(extra.id)) throw new Error(`duplicate song ${extra.id}`);
    add(extra, asDateTags(extra, null));
  }
  return { byId, list };
}

function appear(song, meetingId, slot = {}) {
  const tag = song.dates.find((d) => d.id === meetingId) ?? {};
  const key = slot.key ?? tag.key ?? song.chartKey;
  return {
    ...song,
    canonicalTitle: song.title,
    title: slot.title ?? tag.title ?? song.title,
    assignedKey: key,
    chartKey: song.chartKey
  };
}

// Grupo B (listas de octubre). El tono del lineup es el de la reunión.
// chartKey queda en la nota de Cifra Club cuando la versión es clara; sin
// secciones hasta revisar el chart completo, para no inventar compases.
function grupoB(id, title, serviceKey, dateId, overrides = {}) {
  const chartKey = overrides.chartKey ?? serviceKey;
  const rest = { ...overrides };
  delete rest.chartKey;
  return song(id, title, chartKey, {
    groups: ["B"],
    dates: [{ id: dateId, key: serviceKey }],
    ...rest
  });
}

  const errors = [];
  for (const setlist of items) {
    // El largo lo define el lineup de esa fecha. Ensayo queda afuera.
    // Una fecha sin canciones es válida: octubre ofrece viernes, sábado y domingo vacíos.
    const ids = new Set();
    for (const s of setlist.songs) {
      if (ids.has(s.id)) errors.push(`${setlist.id}: duplicate ${s.id}`);
      ids.add(s.id);
      if (!/^[A-G](?:#|b)?$/.test(s.assignedKey)) errors.push(`${setlist.id}:${s.id}: invalid key`);
      // `pending` gobierna sólo los acordes: nunca se inventan. Artista, video y
      // enlaces se confirman por separado (fuente de verdad: playlist de Darío)
      // y pueden existir aunque el chart siga pendiente.
      if (s.sourceStatus === "pending" && s.sections.length) errors.push(`${setlist.id}:${s.id}: pending source has sections`);
      if (s.youtubeVideoId && !/^[A-Za-z0-9_-]{11}$/.test(s.youtubeVideoId)) {
        errors.push(`${setlist.id}:${s.id}: invalid youtubeVideoId`);
      }
      if (s.chartUrl && !/^https:\/\/www\.cifraclub\.com\/[a-z0-9-]+\/[a-z0-9-]+\/$/.test(s.chartUrl)) {
        errors.push(`${setlist.id}:${s.id}: chartUrl must be a Cifra Club song page`);
      }
    }
  }
  return errors;
}

export const TRANSPOSE_LIMIT = 11;
const SHARP_NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLAT_NOTES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
const ROOT_PATTERN = /^([A-G](?:#|b)?)([^/]*)(?:\/([A-G](?:#|b)?))?$/;

const NOTE_INDEX = (() => {
  const map = Object.create(null);
  SHARP_NOTES.forEach((n, i) => { map[n] = i; });
  FLAT_NOTES.forEach((n, i) => { map[n] = i; });
  // Enharmónicos poco comunes que podrían aparecer en fuentes.
  Object.assign(map, { "E#": 5, "B#": 0, "Cb": 11, "Fb": 4 });
  return map;
})();

const mod12 = (n) => ((n % 12) + 12) % 12;

export function keyToPitchClass(key) {
  const pc = NOTE_INDEX[key];
  return pc === undefined ? null : pc;
}

export function parseChord(chord) {
  if (typeof chord !== "string") return null;
  const match = ROOT_PATTERN.exec(chord.trim());
  if (!match) return null;
  const [, root, suffix, bass] = match;
  if (keyToPitchClass(root) === null) return null;
  if (bass && keyToPitchClass(bass) === null) return null;
  return { root, suffix: suffix ?? "", bass: bass ?? null };
}

export function semitoneDistance(from, to) {
  const a = keyToPitchClass(from);
  const b = keyToPitchClass(to);
  if (a === null || b === null) return 0;
  let d = mod12(b - a);
  if (d > 6) d -= 12;
  return d;
}

export function transposeChord(chord, semitones, accidentalMode = "sharp") {
  const parsed = parseChord(chord);
  if (!parsed) return chord;
  const table = accidentalMode === "flat" ? FLAT_NOTES : SHARP_NOTES;
  const newRoot = table[mod12(keyToPitchClass(parsed.root) + semitones)];
  const newBass = parsed.bass
    ? table[mod12(keyToPitchClass(parsed.bass) + semitones)]
    : null;
  return newRoot + parsed.suffix + (newBass ? `/${newBass}` : "");
}

export function transposeSections(sections, semitones, accidentalMode = "sharp") {
  return sections.map((section) => ({
    ...section,
    measures: section.measures.map((measure) =>
      measure.map((chord) => transposeChord(chord, semitones, accidentalMode))
    )
  }));
}

// Charts en números (Nashville), como los oficiales de Elevation Español:
// "1", "4", "6m", "2m", "1/3" → acordes en la tonalidad dada, con la escritura
// natural de esa tonalidad (bemoles en F/Bb/Eb/Ab/Db/Gb, sostenidos en el resto).
const MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];
const FLAT_KEYS = new Set(["F", "Bb", "Eb", "Ab", "Db", "Gb", "Cb"]);
const DEGREE_RE = /^([1-7])([^/]*)(?:\/([1-7]))?$/;

export function degreeToChord(token, keyRoot) {
  const m = DEGREE_RE.exec(String(token ?? "").trim());
  const rootPc = keyToPitchClass(keyRoot);
  if (!m || rootPc === null) return token; // no es un grado (p. ej. "N.C."): intacto
  const table = FLAT_KEYS.has(keyRoot) ? FLAT_NOTES : SHARP_NOTES;
  const note = (deg) => table[mod12(rootPc + MAJOR_SCALE[Number(deg) - 1])];
  const suffix = m[2] === "°" ? "dim" : m[2];
  return note(m[1]) + suffix + (m[3] ? `/${note(m[3])}` : "");
}

export function degreesToSections(sections, keyRoot) {
  return sections.map((section) => ({
    ...section,
    measures: section.measures.map((measure) => measure.map((t) => degreeToChord(t, keyRoot)))
  }));
}

// Inversa: acorde → grado en la tonalidad (números, estilo Nashville). Los no
// diatónicos llevan alteración (b3, #4, b7); los acordes con bajo van "1/3".
// La calidad (m, 7…) no se incluye: ya está en el símbolo del acorde.
const DEGREE_NAMES = ["1", "b2", "2", "b3", "3", "4", "#4", "5", "b6", "6", "b7", "7"];

export function chordToDegree(chord, keyRoot) {
  const parsed = parseChord(chord);
  const keyPc = keyToPitchClass(keyRoot);
  if (!parsed || keyPc === null) return "";
  const deg = (note) => DEGREE_NAMES[mod12(keyToPitchClass(note) - keyPc)];
  return deg(parsed.root) + (parsed.bass ? `/${deg(parsed.bass)}` : "");
}

/** Semitonos guardados por aparición (`fecha:canción`). Sólo enteros entre −11 y 11. */
export function parseKeyOverrides(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return {};
  const out = {};
  for (const [key, value] of Object.entries(raw)) {
    if (!/^[^:]+:[^:]+$/.test(key)) continue;
    const n = typeof value === "number" ? value : Number(value);
    if (!Number.isInteger(n) || n < -11 || n > 11 || n === 0) continue;
    out[key] = n;
  }
  return out;
}

/** Compases por línea por aparición (2, 4 u 8). `null` vuelve al dato de la canción. */
export function setBarsPerLine(state, setlistId, songId, perLine) {
  const key = `${setlistId}:${songId}`;
  const lineOverrides = { ...(state.lineOverrides ?? {}) };
  if (perLine === null || perLine === undefined) delete lineOverrides[key];
  else lineOverrides[key] = [2, 4, 8].includes(Number(perLine)) ? Number(perLine) : 4;
  return { ...state, lineOverrides };
}

/** Capo manual por aparición (0..11). `null` vuelve al capo automático. */
export function setCapo(state, setlistId, songId, capo) {
  const key = `${setlistId}:${songId}`;
  const capoOverrides = { ...(state.capoOverrides ?? {}) };
  if (capo === null || capo === undefined) delete capoOverrides[key];
  else capoOverrides[key] = clamp(Math.trunc(capo), 0, 11);
  return { ...state, capoOverrides };
}

export const MAX_LYRIC_BYTES = 200 * 1024;

export function validateLyricText(text) {
  if (typeof text !== "string" || !text.trim()) {
    return { ok: false, error: "La letra está vacía" };
  }
  if (text.includes("�")) {
    return { ok: false, error: "El archivo no contiene texto UTF-8 legible" };
  }
  if (new TextEncoder().encode(text).byteLength > MAX_LYRIC_BYTES) {
    return { ok: false, error: "La letra supera 200 KiB" };
  }
  return { ok: true };
}

export function parseLyricsBackup(json, validKeys) {
  const valid = new Set(validKeys);
  const errors = [];
  let data;
  try {
    data = typeof json === "string" ? JSON.parse(json) : json;
  } catch {
    return { ok: false, lyrics: {}, errors: ["JSON inválido"] };
  }
  if (!data || data.schemaVersion !== 1 || typeof data.lyrics !== "object") {
    return { ok: false, lyrics: {}, errors: ["Esquema desconocido"] };
  }
  const lyrics = {};
  for (const [key, value] of Object.entries(data.lyrics)) {
    if (!valid.has(key)) { errors.push(`Clave inexistente: ${key}`); continue; }
    if (!value || typeof value.text !== "string") { errors.push(`Valor inválido: ${key}`); continue; }
    if (!validateLyricText(value.text).ok) { errors.push(`Texto inválido: ${key}`); continue; }
    lyrics[key] = {
      text: value.text,
      updatedAt: typeof value.updatedAt === "string" ? value.updatedAt : new Date().toISOString()
    };
  }
  return { ok: errors.length === 0, lyrics, errors };
}

export function mergeLyrics(current, incoming) {
  const collisions = Object.keys(incoming).filter((k) => k in current);
  return { merged: { ...current, ...incoming }, collisions };
}

export function serializeLyricsBackup(lyrics, now = new Date().toISOString()) {
  return JSON.stringify({ schemaVersion: 1, exportedAt: now, lyrics }, null, 2);
}
/* lyrics-store-module:end */

const YT_HOSTS = new Set(["youtube.com", "www.youtube.com", "m.youtube.com", "music.youtube.com", "youtu.be"]);

export const isValidYouTubeId = (id) => /^[A-Za-z0-9_-]{11}$/.test(id ?? "");

export function extractYouTubeId(url) {
  let parsed;
  try {
    parsed = new URL(url);
  } catch {
    return null;
  }
  if (!YT_HOSTS.has(parsed.hostname)) return null;
  let id = null;
  if (parsed.hostname === "youtu.be") {
    id = parsed.pathname.slice(1).split("/")[0];
  } else if (parsed.pathname === "/watch") {
    id = parsed.searchParams.get("v");
  } else if (parsed.pathname.startsWith("/embed/")) {
    id = parsed.pathname.slice("/embed/".length).split("/")[0];
  }
  return isValidYouTubeId(id) ? id : null;
}

export function buildYouTubeEmbedUrl(id) {
  if (!isValidYouTubeId(id)) throw new TypeError("Invalid YouTube video id");
  return `https://www.youtube-nocookie.com/embed/${id}`;
}

export const clampBpm = (value) => Math.max(40, Math.min(240, Math.round(Number(value) || 120)));
export const normalizeMeter = (value) => ([2, 3, 4, 6].includes(Number(value)) ? Number(value) : 4);
export const secondsPerBeat = (bpm) => 60 / clampBpm(bpm);
export function advanceBeat(currentBeat, beatsPerMeasure) {
  const beat = (currentBeat + 1) % normalizeMeter(beatsPerMeasure);
  return { beat, accented: beat === 0 };
}

// Digitaciones de guitarra orientadas a worship (formas abiertas y voicings
// habituales del género), no clásicas. Las formas viven en tonalidades
// "abiertas"; para las demás se sugiere capo, que es lo que se hace en worship.
// `transpose` se inyecta (es transposeChord) para mantener el bloque puro y
// probable de forma aislada.
export const OPEN_KEYS = ["C", "D", "E", "G", "A"];
export const MAX_SUGGESTED_CAPO = 7;

// "C9" en charts de worship (Cifra Club, TOMATULUGAR…) es el voicing add9, no
// el dominante con novena; "E4" es Esus4. Se resuelven como alias de forma.
const SUFFIX_ALIASES = {
  "2": "add9", "9": "add9", "4": "sus4", "sus": "sus4", "M7": "maj7", "Maj7": "maj7", "maj": "",
  "min": "m", "-": "m", "-7": "m7", "7M": "maj7"
};
const CHORD_RE = /^([A-G](?:#|b)?)([^/]*)(?:\/([A-G](?:#|b)?))?$/;
const X = "x";
const V = (frets, fingers, extra = {}) => ({ frets, fingers, ...extra });

// frets/fingers: 6 valores, cuerda grave (E) → aguda (e). "x" = muteada, 0 = al aire.
export const WORSHIP_VOICINGS = {
  // C
  "C":     V([X, 3, 2, 0, 1, 0], [0, 3, 2, 0, 1, 0]),
  "Cadd9": V([X, 3, 2, 0, 3, 3], [0, 2, 1, 0, 3, 4], { note: "Cadd9 (C2): la forma habitual en worship" }),

export function normalizeChordSymbol(symbol) {
  const m = CHORD_RE.exec(String(symbol ?? "").trim());
  if (!m) return null;
  const [, root, rawSuffix = "", bass] = m;
  const suffix = rawSuffix in SUFFIX_ALIASES ? SUFFIX_ALIASES[rawSuffix] : rawSuffix;
  return { root, suffix, bass: bass ?? null, symbol: root + suffix + (bass ? `/${bass}` : "") };
}

/** Voicing para un símbolo (con alias); si es acorde con bajo y no hay forma
 *  específica, cae a la forma base y lo aclara. null si no hay digitación. */
export function findVoicing(symbol) {
  const n = normalizeChordSymbol(symbol);
  if (!n) return null;
  if (WORSHIP_VOICINGS[n.symbol]) return { symbol: n.symbol, exact: true, ...WORSHIP_VOICINGS[n.symbol] };
  if (n.bass) {
    const base = n.root + n.suffix;
    if (WORSHIP_VOICINGS[base]) {
      return { symbol: base, exact: false, ...WORSHIP_VOICINGS[base], note: `Forma de ${base}; el bajo ${n.bass} queda a criterio del bajista/segunda guitarra` };
    }
  }
  return null;
}

/**
 * Capo sugerido (0..7) para una tonalidad, considerando los acordes del tema.
 * Práctica de worship: se prefiere el capo más bajo que cae en una tonalidad
 * abierta, salvo que otro capo elimine cejillas. Una sola cejilla no mueve el
 * capo (Bm en D o F#m en A son habituales); dos o más sí. Los acordes sin
 * digitación en la tabla cuentan como cejilla. Sin acordes, se comporta como
 * "el capo más bajo a tonalidad abierta".
 */
export function suggestCapo(keyRoot, transpose, chords = []) {
  const playable = chords.filter((c) => c !== "N.C.");
  const candidates = [];
  for (let capo = 0; capo <= MAX_SUGGESTED_CAPO; capo++) {
    const shapeRoot = transpose(keyRoot, -capo, "sharp");
    if (!OPEN_KEYS.includes(shapeRoot)) continue;
    const barres = playable.reduce((n, chord) => {
      const v = findVoicing(transpose(chord, -capo, "sharp"));
      return n + (!v || v.barre ? 1 : 0);
    }, 0);
    candidates.push({ capo, shapeRoot, barres });
  }
  if (candidates.length === 0) return { capo: 0, shapeRoot: keyRoot, barres: 0 };
  const lowest = candidates[0];
  if (lowest.barres <= 1) return lowest;
  return candidates.reduce(
    (best, c) => (c.barres < best.barres || (c.barres === best.barres && c.capo < best.capo) ? c : best),
    lowest
  );
}

/** Forma que se digita para un acorde sonante con un capo dado. */
export function shapeForCapo(symbol, capo, transpose) {
  return capo ? transpose(symbol, -capo, "sharp") : symbol;
}

/** Errores de integridad de la tabla (para pruebas). */
export function voicingsIntegrity(table = WORSHIP_VOICINGS) {
  const errors = [];
  for (const [sym, v] of Object.entries(table)) {
    if (!Array.isArray(v.frets) || v.frets.length !== 6) errors.push(`${sym}: frets must have 6 entries`);
    if (!Array.isArray(v.fingers) || v.fingers.length !== 6) errors.push(`${sym}: fingers must have 6 entries`);
    v.frets?.forEach((f, i) => {
      if (!(f === "x" || (Number.isInteger(f) && f >= 0 && f <= 15))) errors.push(`${sym}: bad fret at ${i}`);
      const fg = v.fingers?.[i];
      if (!(Number.isInteger(fg) && fg >= 0 && fg <= 4)) errors.push(`${sym}: bad finger at ${i}`);
      if ((f === "x" || f === 0) && fg !== 0) errors.push(`${sym}: finger on open/muted string ${i}`);
    });
    if (v.barre) {
      const { fret, from, to } = v.barre;
      if (!(from >= 0 && to <= 5 && from < to)) errors.push(`${sym}: bad barre range`);
      if (!v.frets.slice(from, to + 1).some((f) => f === fret)) errors.push(`${sym}: barre fret not in frets`);
    }
    if (!normalizeChordSymbol(sym) || normalizeChordSymbol(sym).symbol !== sym) errors.push(`${sym}: key is not canonical`);
  }
  return errors;
}

/* structure-module:start */
// Estructura de la canción para el escenario: el RECORRIDO en orden (con
// repeticiones e indicaciones) y los BLOQUES ÚNICOS de acordes. Secciones con la
// misma secuencia de acordes se muestran una sola vez, con todas sus etiquetas
// ("Verso 1 · Verso 2"). Si una misma etiqueta corresponde a secuencias
// distintas, se desambigua con (A), (B)… por orden de aparición.
export const SECTION_TYPE_LABELS = {
  intro: ["Intro", "Intros"], verse: ["Verso", "Versos"], prechorus: ["Pre-coro", "Pre-coros"],
  chorus: ["Coro", "Coros"], bridge: ["Puente", "Puentes"], instrumental: ["Instrumental", "Instrumentales"],
  interlude: ["Interludio", "Interludios"], vamp: ["Vamp", "Vamps"], tag: ["Tag", "Tags"],
  outro: ["Outro", "Outros"], other: ["Sección", "Secciones"]
};

export function songStructure(sections) {
  const blocks = [];
  const byKey = new Map();
  const roadmap = sections.map((s, index) => {
    const key = JSON.stringify(s.measures);
    let block = byKey.get(key);
    if (!block) {
      block = { id: blocks.length, labels: [], occurrences: [], measures: s.measures, firstIndex: index };
      byKey.set(key, block);
      blocks.push(block);
    }
    if (!block.labels.includes(s.label)) block.labels.push(s.label);
    block.occurrences.push(index);
    return { index, label: s.label, repeats: s.repeats ?? 1, cue: s.cue ?? null, type: s.type ?? "other", blockId: block.id };
  });

  // Una etiqueta usada por más de un bloque distinto → sufijo (A), (B)…
  const labelToBlocks = new Map();
  for (const b of blocks) for (const l of b.labels) labelToBlocks.set(l, [...(labelToBlocks.get(l) ?? []), b.id]);
  const suffix = new Map();
  for (const [label, ids] of labelToBlocks) {
    if (ids.length > 1) ids.forEach((id, i) => suffix.set(`${id}|${label}`, ` (${String.fromCharCode(65 + i)})`));
  }
  const display = (blockId, label) => label + (suffix.get(`${blockId}|${label}`) ?? "");

  const namedBlocks = blocks.map((b) => {
    const displayLabels = b.labels.map((l) => display(b.id, l));
    return { ...b, displayLabels, title: displayLabels.join(" · ") };
  });
  const namedRoadmap = roadmap.map((r) => ({ ...r, displayLabel: display(r.blockId, r.label) }));

  // Resumen de tipos: cuántas secciones DISTINTAS (por etiqueta) hay de cada tipo.
  const perType = new Map();
  sections.forEach((s, i) => {
    const t = s.type ?? "other";
    const e = perType.get(t) ?? { type: t, labels: new Set(), firstIndex: i };
    e.labels.add(s.label);
    perType.set(t, e);
  });
  const typeSummary = [...perType.values()].sort((a, b) => a.firstIndex - b.firstIndex)
    .map((e) => ({ type: e.type, count: e.labels.size }));

  return { roadmap: namedRoadmap, blocks: namedBlocks, typeSummary };
}

export function structureSummary(typeSummary, labels = SECTION_TYPE_LABELS) {
  return typeSummary.map(({ type, count }) => {
    const [singular, plural] = labels[type] ?? labels.other;
    return count > 1 ? `${count} ${plural.toLowerCase()}` : singular;
  }).join(" · ");
}

function measuresEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

/** Agrupa vueltas idénticas y consecutivas dentro de una sección.
 *  Sol Do Re Sol Do Re Sol Do Re Sol Re Re → (Sol Do Re)×3, Sol, Re×2.
 *  Si dos patrones cubren los mismos compases, gana el más corto. */
export function repeatedPatternSpans(measures) {
  const spans = [];
  let i = 0;
  while (i < measures.length) {
    let bestLen = 1;
    let bestTimes = 1;
    let bestCover = 1;
    const maxLen = Math.floor((measures.length - i) / 2);
    for (let len = 1; len <= maxLen; len++) {
      let times = 1;
      while (i + (times + 1) * len <= measures.length) {
        let same = true;
        for (let k = 0; k < len; k++) {
          if (!measuresEqual(measures[i + k], measures[i + times * len + k])) { same = false; break; }
        }
        if (!same) break;
        times++;
      }
      const cover = times * len;
      if (times >= 2 && (cover > bestCover || (cover === bestCover && len < bestLen))) {
        bestLen = len;
        bestTimes = times;
        bestCover = cover;
      }
    }
    if (bestTimes >= 2) {
      spans.push({ start: i, length: bestLen, repeats: bestTimes });
      i += bestCover;
    } else {
      const last = spans.at(-1);
      if (last && last.repeats === 1 && last.start + last.length === i) last.length += 1;
      else spans.push({ start: i, length: 1, repeats: 1 });
      i += 1;
    }
  }
  return spans;
}

/** Corta los compases de una sección en filas de `perLine` (2, 4 u 8). La
 *  última fila puede quedar incompleta; nunca se reparte "6 y 2". */
export const BARS_PER_LINE_OPTIONS = [2, 4, 8];
export function chunkMeasures(measures, perLine = 4) {
  const n = BARS_PER_LINE_OPTIONS.includes(perLine) ? perLine : 4;
  const rows = [];
  for (let i = 0; i < measures.length; i += n) rows.push(measures.slice(i, i + n));
  return rows;
}
/* structure-module:end */

/* simplify-module:start */
// Simplificación de acordes (pedido de Darío, 2026-09-17): menos acordes de paso.
//  - "none":    tal cual el chart.
//  - "basic":   cada acorde a su tríada (sin bajo, sin sus/add/2/9/7/maj7/5…;
//               se conservan menores, dim, aug y N.C.) y se colapsan las
//               repeticiones consecutivas dentro del compás.
//  - "minimal": "basic" + un solo acorde por compás (el del tiempo fuerte).
// Se aplica antes de armar la estructura, así bloques que sólo diferían por
// un acorde de paso se unifican.
export const SIMPLIFY_LEVELS = ["none", "basic", "minimal"];
export const SIMPLIFY_LABELS = { none: "Completos", basic: "Básicos", minimal: "Mínimos" };
const SIMPLE_RE = /^([A-G](?:#|b)?)([^/]*)(?:\/.*)?$/;

export function simplifyChord(chord) {
  const m = SIMPLE_RE.exec(String(chord ?? "").trim());
  if (!m) return chord; // N.C. u otros tokens: intactos
  const [, root, suffix] = m;
  if (/^(dim|°)/.test(suffix)) return root + "dim";
  if (/^aug|^\+/.test(suffix)) return root + "aug";
  if (/^(m|min|-)(?!aj)/.test(suffix)) return root + "m";
  return root;
}

export function simplifyMeasure(measure, level = "basic") {
  if (level === "none") return measure;
  const out = [];
  for (const chord of measure) {
    const s = simplifyChord(chord);
    if (out[out.length - 1] !== s) out.push(s);
  }
  return level === "minimal" ? out.slice(0, 1) : out;
}

export function simplifySections(sections, level = "none") {
  if (level === "none") return sections;
  return sections.map((section) => ({
    ...section,
    measures: section.measures.map((measure) => simplifyMeasure(measure, level))
  }));
}
/* simplify-module:end */

/* catalog-module:start */
// Home (pedido de Darío, 2026-09-22): índice de todas las canciones de todas las
// reuniones, una entrada por canción (agrupadas por id) con sus apariciones,
// buscable por título/artista (sin distinguir acentos ni mayúsculas) y
// filtrable por tono, reunión y disponibilidad de partitura.
const KEY_ORDER = ["C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#", "Gb", "G", "G#", "Ab", "A", "A#", "Bb", "B"];

export function normalizeText(text) {
  return String(text ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

export function buildCatalog(setlists, librarySongs = []) {
  const byId = new Map();
  setlists.forEach((sl, setlistIndex) => {
    sl.songs.forEach((song, songIndex) => {
      const title = song.canonicalTitle ?? song.title;
      const entry = byId.get(song.id) ?? {
        id: song.id, title, artist: song.artist, aliases: [],
        hasChart: song.sections.length > 0,
        assignedKey: song.chartKey ?? song.assignedKey,
        chartUrl: song.chartUrl, lyricsUrl: song.lyricsUrl, youtubeUrl: song.youtubeUrl,
        appearances: []
      };
      if (song.title && song.title !== title && !entry.aliases.includes(song.title)) entry.aliases.push(song.title);
      entry.hasChart = entry.hasChart || song.sections.length > 0;
      entry.appearances.push({
        setlistIndex, setlistId: sl.id, label: sl.shortLabel, date: sl.date, songIndex,
        assignedKey: song.assignedKey, title: song.title
      });
      byId.set(song.id, entry);
    });
  });
  for (const song of librarySongs) {
    if (byId.has(song.id)) continue;
    byId.set(song.id, {
      id: song.id, title: song.title, artist: song.artist,
      hasChart: song.sections.length > 0,
      assignedKey: song.assignedKey,
      chartUrl: song.chartUrl, lyricsUrl: song.lyricsUrl, youtubeUrl: song.youtubeUrl,
      appearances: []
    });
  }
  return [...byId.values()].sort((a, b) => a.title.localeCompare(b.title, "es", { sensitivity: "base" }));
}

export function catalogKeys(items) {
  const keys = new Set();
  for (const it of items) {
    if (it.appearances.length === 0 && it.assignedKey) keys.add(it.assignedKey);
    for (const a of it.appearances) keys.add(a.assignedKey);
  }
  return [...keys].sort((a, b) => KEY_ORDER.indexOf(a) - KEY_ORDER.indexOf(b));
}

const MONTH_NAMES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

export function monthLabel(month) {
  const [year, mm] = String(month).split("-");
  const name = MONTH_NAMES[Number(mm) - 1];
  return name ? `${name} ${year}` : String(month);
}

function setlistHasSongs(setlist, items) {
  if (Array.isArray(setlist.songs)) return setlist.songs.length > 0;
  return items.some((item) => (item.appearances ?? []).some((appearance) => appearance.setlistId === setlist.id));
}

/** Mes, después grupo, después reunión. El grupo lo declara el lineup de esa fecha. */
export function homeFacets(items, setlists, filters = {}) {
  const pool = (omit) => filterCatalog(items, { ...filters, [omit]: "" });
  const rows = setlists
    .filter((setlist) => setlist.group && setlistHasSongs(setlist, items))
    .map((setlist) => ({
      id: setlist.id,
      month: setlist.date ? String(setlist.date).slice(0, 7) : "",
      date: setlist.date ?? "9999-99-99",
      groups: [setlist.group]
    }))
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const months = [];
  for (const row of rows) {
    if (row.month && !months.includes(row.month)) months.push(row.month);
  }
  const inMonth = rows.filter((row) => !filters.month || row.month === filters.month);
  const groups = GROUPS.filter((group) => inMonth.some((row) => row.groups.includes(group)));
  const setlistIds = inMonth
    .filter((row) => !filters.group || row.groups.includes(filters.group))
    .map((row) => row.id);
  const statusPool = pool("status");
  const statuses = [];
  if (statusPool.some((item) => item.hasChart)) statuses.push("chart");
  if (statusPool.some((item) => !item.hasChart)) statuses.push("pending");
  return { keys: catalogKeys(pool("key")), months, setlistIds, groups, statuses };
}

/** Con mes, grupo o reunión, el índice sigue el puesto del lineup. Sin eso, queda el orden alfabético. */
export function sortByLineup(items, { setlistId = "", allowedIds = null } = {}) {
  if (!setlistId && !allowedIds) return items;
  const rankOf = (item) => {
    const hits = (item.appearances ?? []).filter((appearance) => {
      if (setlistId) return appearance.setlistId === setlistId;
      return allowedIds.has(appearance.setlistId);
    });
    if (!hits.length) return null;
    hits.sort((a, b) => String(a.date ?? "").localeCompare(String(b.date ?? "")) || a.songIndex - b.songIndex);
    return hits[0];
  };
  return items.slice().sort((a, b) => {
    const left = rankOf(a);
    const right = rankOf(b);
    if (!left && !right) return 0;
    if (!left) return 1;
    if (!right) return -1;
    const byDate = String(left.date ?? "").localeCompare(String(right.date ?? ""));
    if (byDate) return byDate;
    return left.songIndex - right.songIndex;
  });
}

export function filterCatalog(items, { query = "", key = "", month = "", setlistId = "", status = "", group = "" } = {}) {
  const q = normalizeText(query);
  const inKey = (it) => it.appearances.some((a) => a.assignedKey === key) || (it.appearances.length === 0 && it.assignedKey === key);
  const inMonth = (it) => it.appearances.some((a) => String(a.date ?? "").startsWith(month));
  return items.filter((it) =>
    (!q || normalizeText(it.title).includes(q) || normalizeText(it.artist).includes(q) || (it.aliases ?? []).some((a) => normalizeText(a).includes(q))) &&
    (!key || inKey(it)) &&
    (!month || inMonth(it)) &&
    (!setlistId || it.appearances.some((a) => a.setlistId === setlistId)) &&
    (!status || (status === "chart" ? it.hasChart : !it.hasChart)) &&
    (!group || (it.groups ?? []).includes(group))
  );
}

// Fechas y grupos editables desde Home. Una canción puede estar en varias
// reuniones y en varios grupos (A, B y C). Sin `dateIds` en la edición se
// conservan las fechas del repertorio. El grupo de partida es A.
export const GROUPS = ["A", "B", "C"];

export function normalizeGroups(groups) {
  const set = new Set(Array.isArray(groups) ? groups : []);
  return GROUPS.filter((g) => set.has(g));
}

export function dateIdsOf(setlists, songId) {
  return setlists.filter((sl) => sl.songs.some((s) => s.id === songId)).map((sl) => sl.id);
}

export function assignedDateIds(setlists, songId, assignment) {
  if (assignment && Array.isArray(assignment.dateIds)) {
    const known = new Set(setlists.map((sl) => sl.id));
    return assignment.dateIds.filter((id) => known.has(id));
  }
  return dateIdsOf(setlists, songId);
}

export function withDate(dateIds, setlistId) {
  return dateIds.includes(setlistId) ? dateIds : [...dateIds, setlistId];
}

export function withoutDate(dateIds, setlistId) {
  return dateIds.filter((id) => id !== setlistId);
}

export function withGroup(groups, group) {
  return normalizeGroups([...(groups ?? []), group]);
}

export function withoutGroup(groups, group) {
  return normalizeGroups(groups).filter((g) => g !== group);
}

/** Aplica ediciones locales sobre las reuniones, sin mutar las listas de origen. */
export function applyDateAssignments(setlists, songs, assignments = {}) {
  return setlists.map((sl) => {
    const songsOut = [];
    const seen = new Set();
    for (const song of sl.songs) {
      const ids = assignedDateIds(setlists, song.id, assignments[song.id]);
      if (!ids.includes(sl.id) || seen.has(song.id)) continue;
      songsOut.push(song);
      seen.add(song.id);
    }
    for (const song of songs) {
      if (seen.has(song.id)) continue;
      const ids = assignedDateIds(setlists, song.id, assignments[song.id]);
      if (!ids.includes(sl.id)) continue;
      songsOut.push({
        ...song,
        canonicalTitle: song.canonicalTitle ?? song.title,
        title: song.title,
        assignedKey: song.chartKey ?? song.assignedKey
      });
      seen.add(song.id);
    }
    return { ...sl, songs: songsOut };
  });
}

/** Orden guardado por reunión: ids conocidos primero; el resto queda al final. */
export function parseSongOrders(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return {};
  const out = {};
  for (const [id, value] of Object.entries(raw)) {
    if (!id || !Array.isArray(value)) continue;
    const ids = value.filter((songId) => typeof songId === "string" && songId.length > 0);
    if (ids.length) out[id] = ids;
  }
  return out;
}

export function reorderIds(ids, fromIndex, toIndex) {
  const next = Array.isArray(ids) ? ids.slice() : [];
  if (!Number.isInteger(fromIndex) || !Number.isInteger(toIndex)) return next;
  if (fromIndex < 0 || toIndex < 0 || fromIndex >= next.length || toIndex >= next.length || fromIndex === toIndex) return next;
  const [item] = next.splice(fromIndex, 1);
  next.splice(toIndex, 0, item);
  return next;
}

export function applySongOrder(songs, orderIds) {
  const list = songs.slice();
  if (!Array.isArray(orderIds) || orderIds.length === 0) return list;
  const byId = new Map(list.map((song) => [song.id, song]));
  const used = new Set();
  const out = [];
  for (const id of orderIds) {
    const song = byId.get(id);
    if (!song || used.has(id)) continue;
    out.push(song);
    used.add(id);
  }
  for (const song of list) {
    if (!used.has(song.id)) out.push(song);
  }
  return out;
}

// El ensayo guardado como 16/10 pasa a 18/10 una sola vez. Después el 16 queda libre.
function migrateStoredDate(fromId, toId) {
  const flag = `worship-setlist:moved:${fromId}`;
  const rewrite = (key, transform) => {
    const raw = localStorage.getItem(key);
    if (!raw) return;
    const next = transform(JSON.parse(raw));
    if (next !== undefined) localStorage.setItem(key, JSON.stringify(next));
  };
  const movePrefix = (parsed) => {
    if (!parsed || typeof parsed !== "object") return undefined;
    let changed = false;
    for (const key of Object.keys(parsed)) {
      if (!key.startsWith(`${fromId}:`)) continue;
      const next = `${toId}:${key.slice(fromId.length + 1)}`;
      if (!(next in parsed)) parsed[next] = parsed[key];
      delete parsed[key];
      changed = true;
    }
    return changed ? parsed : undefined;
  };
  try {
    if (localStorage.getItem(flag)) return;
    rewrite("worship-setlist:assignments:v1", (parsed) => {
      if (!parsed || typeof parsed !== "object") return undefined;
      let changed = false;
      for (const entry of Object.values(parsed)) {
        if (!entry || !Array.isArray(entry.dateIds) || !entry.dateIds.includes(fromId)) continue;
        entry.dateIds = [...new Set(entry.dateIds.map((id) => (id === fromId ? toId : id)))];
        changed = true;
      }
      return changed ? parsed : undefined;
    });
    rewrite("worship-setlist:order:v1", (parsed) => {
      if (!parsed || typeof parsed !== "object" || !parsed[fromId]) return undefined;
      if (!parsed[toId]) parsed[toId] = parsed[fromId];
      delete parsed[fromId];
      return parsed;
    });
    rewrite("worship-setlist:keys:v1", movePrefix);
    rewrite("worship-setlist:lyrics:v1", movePrefix);
    localStorage.setItem(flag, "1");
  } catch { /* la sesión sigue con lo que haya */ }
}

function syncStoredLineups(lineups, flag) {
  try {
    if (localStorage.getItem(flag)) return;
    const key = "worship-setlist:assignments:v1";
    const raw = localStorage.getItem(key);

      const parsed = JSON.parse(raw);

          if (!entry || typeof entry !== "object" || !Array.isArray(entry.dateIds)) continue;
          for (const [dateId, songIds] of Object.entries(lineups)) {
            const belongs = songIds.includes(id);
            const has = entry.dateIds.includes(dateId);
            if (belongs && !has) {

            } else if (!belongs && has) {
              entry.dateIds = entry.dateIds.filter((stored) => stored !== dateId);
              changed = true;

        }
        if (changed) localStorage.setItem(key, JSON.stringify(parsed));
      }
    }
    const orderKey = "worship-setlist:order:v1";
    const orderRaw = localStorage.getItem(orderKey);
    if (orderRaw) {
      const order = JSON.parse(orderRaw);
      if (order && typeof order === "object") {
        let changed = false;
        for (const [dateId, songIds] of Object.entries(lineups)) {
          if (!Array.isArray(order[dateId])) continue;
          order[dateId] = songIds.slice();
          changed = true;
        }
        if (changed) localStorage.setItem(orderKey, JSON.stringify(order));

function multiMenu(menu, label, emptyText, options, selected, onChange) {
  const details = document.createElement("details");
  details.className = "menu";
  details.dataset.menu = menu;
  const summary = document.createElement("summary");
  const chosen = options.filter(([value]) => selected.includes(value)).map(([, text]) => text);
  summary.textContent = chosen.length ? chosen.join(", ") : emptyText;
  summary.setAttribute("aria-label", label);
  const panel = document.createElement("div");
  panel.className = "panel";
  for (const [value, text] of options) {
    const row = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = value;
    input.checked = selected.includes(value);
    input.addEventListener("change", () => {
      const picked = new Set([...panel.querySelectorAll("input:checked")].map((box) => box.value));
      onChange(options.filter(([id]) => picked.has(id)).map(([id]) => id), value);
    });
    row.append(input, document.createTextNode(text));
    panel.appendChild(row);
  }
  details.append(summary, panel);
  return details;
}
