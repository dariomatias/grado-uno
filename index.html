    (ids, focusValue) => editSong(item.id, ids, groups, "fechas", focusValue)
  ));
  row.appendChild(multiMenu(
    "grupos",
    `Grupos de ${item.title}`,
    "Sin grupo",
    GROUPS.map((group) => [group, `Grupo ${group}`]),
    groups,
    (ids, focusValue) => editSong(item.id, dateIds, ids, "grupos", focusValue)
  ));
  parent.appendChild(row);
}

function announce(message) {
  el.status.textContent = message;
}

function editSong(songId, dateIds, groups, menu, focusValue) {
  assignmentStore.save(songId, dateIds, groups);
  rebuildLive();
  renderList();
  announce("Canción actualizada");
  if (!menu) return;
  const root = el.cards.querySelector(`li[data-song-id="${CSS.escape(songId)}"] details[data-menu="${menu}"]`);
  if (!root) return;
  root.open = true;
  if (focusValue) root.querySelector(`input[value="${CSS.escape(focusValue)}"]`)?.focus();
}

function activeSetlist() {
  return liveSetlists[state.activeSetlistIndex];
}
function selectedSong() {
  if (librarySongId) return songs.find((s) => s.id === librarySongId);
  return activeSetlist().songs[state.selectedSongIndex];
}
function contextSetlistId() {
  return librarySongId ? "general" : activeSetlist().id;
}
function keyFor(song) {
  return appearanceKey(contextSetlistId(), song.id);
}
function transposeFor(song) {
  return state.transpositions[keyFor(song)] ?? 0;
}
function chartSemis(song) {
  if (!song.chartKey || song.chartKey === song.assignedKey) return 0;
  return semitoneDistance(song.chartKey, song.assignedKey);
}
function chordSpelling(song, sessionSemis) {
  if (sessionSemis === 0 && FLAT_KEYS.has(song.assignedKey)) return "flat";
  return state.accidentalMode;
}
function currentKey(song) {
  return playedLabel(song.assignedKey, transposeFor(song));
}

function keyName(assignedKey, semis) {
  const idx = keyToPitchClass(assignedKey);
  if (idx === null) return assignedKey;
  const table = state.accidentalMode === "flat"
    ? ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"]
    : CHROMATIC;
  return table[((idx + semis) % 12 + 12) % 12];
}

function playedLabel(assignedKey, semis) {
  return semis ? keyName(assignedKey, semis) : assignedKey;
}

/* ---- Render: calendario de fechas (Home + una por reunión) ---- */
function tabDefs() {
  return [{ id: "home", label: "Home", home: true }, ...liveSetlists.map((sl, index) => ({ id: sl.id, label: sl.shortLabel, index }))];
}

let datePickerOpen = false;
let pickerMonth = "";

function datedMeetings() {
  return liveSetlists.filter((setlist) => setlist.date);
}

function pickerMonths() {
  return [...new Set(datedMeetings().map((setlist) => String(setlist.date).slice(0, 7)))].sort();
}

function selectedMeeting() {
  return state.home ? null : liveSetlists[state.activeSetlistIndex] ?? null;
}

function closeDatePicker() {
  datePickerOpen = false;
  el.datePicker.hidden = true;
  el.meetingSelect.setAttribute("aria-expanded", "false");
}

function openDatePicker() {
  const active = selectedMeeting();
  const months = pickerMonths();
  pickerMonth = active?.date ? String(active.date).slice(0, 7) : (months.at(-1) ?? "");
  datePickerOpen = true;
  el.datePicker.hidden = false;
  el.meetingSelect.setAttribute("aria-expanded", "true");
  renderDatePicker();
}

function renderMeetingSelect() {
  const tabs = tabDefs();
  const selected = tabs.findIndex((tab) => tab.home ? state.home : !state.home && tab.index === state.activeSetlistIndex);
  el.meetingSelect.textContent = tabs[selected]?.label ?? "Home";
  el.meetingSelect.setAttribute("aria-expanded", datePickerOpen ? "true" : "false");
  if (datePickerOpen) renderDatePicker();
}

function groupSwatch(group, text) {
  const span = document.createElement("span");
  span.className = `swatch group-${group.toLowerCase()}`;
  span.textContent = text;
  return span;
}

function renderDatePicker() {
  const months = pickerMonths();
  if (!months.length) return;
  if (!months.includes(pickerMonth)) pickerMonth = months.at(-1);
  const monthIndex = months.indexOf(pickerMonth);
  el.datePrev.disabled = monthIndex <= 0;
  el.dateNext.disabled = monthIndex >= months.length - 1;
  el.dateMonth.textContent = monthLabel(pickerMonth);

  el.datePickerLegend.replaceChildren(
    groupSwatch("A", "Grupo A"),
    groupSwatch("B", "Grupo B"),
    groupSwatch("C", "Grupo C")
  );

  const [year, month] = pickerMonth.split("-").map(Number);
  const start = new Date(Date.UTC(year, month - 1, 1));
  const offset = (start.getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(year, month, 0)).getUTCDate();
  const byDate = new Map(datedMeetings().map((setlist) => [setlist.date, setlist]));
  const active = selectedMeeting();
  el.dateGrid.replaceChildren();
  for (let i = 0; i < offset; i++) {
    const pad = document.createElement("span");
    pad.className = "pad";
    el.dateGrid.appendChild(pad);
  }
  for (let day = 1; day <= days; day++) {
    const iso = `${pickerMonth}-${String(day).padStart(2, "0")}`;
    const meeting = byDate.get(iso);
    if (!meeting) {
      const span = document.createElement("span");
      span.className = "pad";
      span.textContent = String(day);
      el.dateGrid.appendChild(span);
      continue;
    }
    const button = document.createElement("button");
    button.type = "button";
    button.className = "day";
    if (meeting.group) button.classList.add(`group-${meeting.group.toLowerCase()}`);
    button.setAttribute("aria-pressed", String(active?.id === meeting.id));
    button.setAttribute("aria-label", meeting.group ? `${meeting.shortLabel}, Grupo ${meeting.group}` : meeting.shortLabel);
    button.innerHTML = `<span>${day}</span>${meeting.group ? `<span class="g">${meeting.group}</span>` : ""}`;
    button.addEventListener("click", () => {
      activateTab(meeting.id);
      closeDatePicker();
    });
    el.dateGrid.appendChild(button);
  }

  el.dateWhen.replaceChildren();
  for (const group of ["A", "B", "C"]) {
    const hits = datedMeetings().filter((setlist) => String(setlist.date).startsWith(pickerMonth) && setlist.group === group);
    if (!hits.length) continue;
    const line = document.createElement("p");
    const daysLabel = hits.map((setlist) => setlist.shortLabel.slice(0, 2));
    const when = daysLabel.length === 1
      ? daysLabel[0]
      : `${daysLabel.slice(0, -1).join(", ")} y ${daysLabel.at(-1)}`;
    line.append(groupSwatch(group, `Grupo ${group}`), document.createTextNode(` toca el ${when}`));
    el.dateWhen.appendChild(line);
  }

  el.dateExtra.replaceChildren();
  const home = document.createElement("button");
  home.type = "button";
  home.className = "datepick-home";
  home.textContent = "Home";
  home.setAttribute("aria-pressed", String(state.home));
  home.addEventListener("click", () => {
    activateTab("home");
    closeDatePicker();
  });
  el.dateExtra.appendChild(home);
  for (const setlist of liveSetlists.filter((item) => !item.date)) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = setlist.group ? `group-${setlist.group.toLowerCase()}` : "";
    button.textContent = setlist.group ? `${setlist.shortLabel} · Grupo ${setlist.group}` : setlist.shortLabel;
    button.setAttribute("aria-pressed", String(active?.id === setlist.id));
    button.addEventListener("click", () => {
      activateTab(setlist.id);
      closeDatePicker();
    });
    el.dateExtra.appendChild(button);
  }
  placeDatePicker();
}

function activateTab(id) {
  if (id === "home") {
    state = { ...state, home: true };
  } else {
    const index = liveSetlists.findIndex((setlist) => setlist.id === id);
    if (index < 0) return;
    state = selectSetlist(state, index, liveSetlists.length - 1);
  }
  renderMeetingSelect();
  renderList();
}

el.meetingSelect.addEventListener("click", () => {
  if (datePickerOpen) closeDatePicker();
  else openDatePicker();
});
function placeDatePicker() {
  const pop = el.datePicker;
  pop.style.left = "0px";
  const overflow = pop.getBoundingClientRect().right - document.documentElement.clientWidth + 12;
  if (overflow > 0) pop.style.left = `${-overflow}px`;
}
el.datePrev.addEventListener("click", () => {
  const months = pickerMonths();
  const index = months.indexOf(pickerMonth);
  if (index > 0) {
    pickerMonth = months[index - 1];
    renderDatePicker();
  }
});
el.dateNext.addEventListener("click", () => {
  const months = pickerMonths();
  const index = months.indexOf(pickerMonth);
  if (index >= 0 && index < months.length - 1) {
    pickerMonth = months[index + 1];
    renderDatePicker();
  }
});
document.addEventListener("pointerdown", (event) => {
  if (!datePickerOpen) return;
  if (el.datePicker.contains(event.target) || el.meetingSelect.contains(event.target)) return;
  closeDatePicker();
});
document.addEventListener("keydown", (event) => {
  if (datePickerOpen && event.key === "Escape") {
    closeDatePicker();
    el.meetingSelect.focus();
  }
});

/** Listado bajo las pestañas: Home (índice) o la reunión activa. */
function renderList() {
  el.cards.classList.toggle("setlist", !state.home);
  if (state.home) renderHome(); else renderSetlist();
}

/* ---- Render: Home (índice de todas las canciones) ---- */
function ensureHomeControls() {
  if (homeControls) return homeControls;
  const wrap = document.createElement("div");
  wrap.className = "home-controls";
  wrap.id = "homeControls";

  const search = document.createElement("input");
  search.type = "search";
  search.id = "homeSearch";
  search.placeholder = "Buscar por título o artista";
  search.setAttribute("aria-label", "Buscar canción por título o artista");
  search.autocomplete = "off";
  search.addEventListener("input", () => {
    state = setHomeFilters(state, { query: search.value });
    renderHomeCards();
  });

  const makeSelect = (id, label, options) => {
    const select = document.createElement("select");
    select.id = id;
    select.setAttribute("aria-label", label);
    for (const [value, text] of options) {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = text;
      select.appendChild(opt);
    }
    return select;
  };
  const keySelect = makeSelect("homeKey", "Filtrar por tono", [["", "Tono: todos"]]);
  const monthSelect = makeSelect("homeMonth", "Filtrar por mes", [["", "Mes: todos"]]);
  const setlistSelect = makeSelect("homeSetlist", "Filtrar por reunión", [["", "Reunión: todas"]]);
  const statusSelect = makeSelect("homeStatus", "Filtrar por partitura", [["", "Partitura: todas"]]);
  const groupSelect = makeSelect("homeGroup", "Filtrar por grupo", [["", "Grupo: todos"]]);
  for (const [select, field] of [[keySelect, "key"], [monthSelect, "month"], [setlistSelect, "setlistId"], [statusSelect, "status"], [groupSelect, "group"]]) {
    select.addEventListener("change", () => {
      state = setHomeFilters(state, { [field]: select.value });
      renderHomeCards();
    });
  }

  const clear = document.createElement("button");
  clear.type = "button";
  clear.textContent = "Limpiar";
  clear.addEventListener("click", () => {
    state = setHomeFilters(state, { query: "", key: "", month: "", setlistId: "", status: "", group: "" });
    renderHome();
    search.focus();
  });

  const count = document.createElement("span");
  count.className = "home-count";
  count.id = "homeCount";
  count.setAttribute("aria-live", "polite");

  wrap.append(search, monthSelect, groupSelect, setlistSelect, keySelect, statusSelect, clear, count);
  el.cards.parentElement.insertBefore(wrap, el.cards);
  homeControls = { wrap, search, keySelect, monthSelect, setlistSelect, statusSelect, groupSelect, count };
  return homeControls;
}

function replaceSelectOptions(select, options, selected) {
  const keep = options.some(([value]) => value === selected) ? selected : "";
  select.replaceChildren();
  for (const [value, text] of options) {
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = text;
    select.append(opt);
  }
  select.value = keep;
  return keep;
}

function refreshHomeFacets() {
  const c = homeControls;
  if (!c) return;
  let filters = { query: "", key: "", month: "", setlistId: "", status: "", group: "", ...(state.homeFilters ?? {}) };
  let facets = homeFacets(liveCatalog, liveSetlists, filters);
  if (filters.month && !facets.months.includes(filters.month)) {
    filters = { ...filters, month: "", group: "", setlistId: "" };
    facets = homeFacets(liveCatalog, liveSetlists, filters);
  } else if (filters.group && !facets.groups.includes(filters.group)) {
    filters = { ...filters, group: "", setlistId: "" };
    facets = homeFacets(liveCatalog, liveSetlists, filters);
  } else if (filters.setlistId && !facets.setlistIds.includes(filters.setlistId)) {
    filters = { ...filters, setlistId: "" };
    facets = homeFacets(liveCatalog, liveSetlists, filters);
  }
  const key = replaceSelectOptions(c.keySelect, [["", "Tono: todos"], ...facets.keys.map((k) => [k, `Tono: ${k}`])], filters.key);
  const month = replaceSelectOptions(c.monthSelect, [["", "Mes: todos"], ...facets.months.map((m) => [m, `Mes: ${monthLabel(m)}`])], filters.month);
  const setlistId = replaceSelectOptions(c.setlistSelect, [
    ["", "Reunión: todas"],
    ...facets.setlistIds.map((id) => [id, `Reunión: ${liveSetlists.find((sl) => sl.id === id).shortLabel}`])
  ], filters.setlistId);
  const group = replaceSelectOptions(c.groupSelect, [["", "Grupo: todos"], ...facets.groups.map((g) => [g, `Grupo ${g}`])], filters.group);
  const statusLabel = { chart: "Con partitura", pending: "Sin partitura" };
  const status = replaceSelectOptions(c.statusSelect, [["", "Partitura: todas"], ...facets.statuses.map((s) => [s, statusLabel[s]])], filters.status);
  if (key !== filters.key || month !== filters.month || setlistId !== filters.setlistId || group !== filters.group || status !== filters.status) {
    state = setHomeFilters(state, { key, month, setlistId, group, status });
  }
}

function renderHome() {
  const c = ensureHomeControls();
  c.wrap.hidden = false;
  c.search.value = state.homeFilters?.query ?? "";
  renderHomeCards();
}

function renderHomeCards() {
  const c = ensureHomeControls();
  refreshHomeFacets();
  const filters = state.homeFilters ?? {};
  const allowedDates = (filters.month || filters.group)
    ? new Set(homeFacets(liveCatalog, liveSetlists, filters).setlistIds)
    : null;
  let items = filterCatalog(liveCatalog, filters);
  if (allowedDates) items = items.filter((item) => item.appearances.some((appearance) => allowedDates.has(appearance.setlistId)));
  if (filters.setlistId || allowedDates) items = sortByLineup(items, { setlistId: filters.setlistId, allowedIds: allowedDates });
  c.count.textContent = `${items.length} de ${liveCatalog.length} canciones`;
  el.cards.innerHTML = "";
  if (items.length === 0) {
    const li = document.createElement("li");
    li.className = "home-empty";
    li.textContent = "Ninguna canción coincide con la búsqueda.";
    el.cards.appendChild(li);
    return;
  }
  items.forEach((item, position) => {
    // Aparición "principal": la de la reunión filtrada si hay, si no la primera.
    const main = item.appearances.find((a) => a.setlistId === filters.setlistId) ?? item.appearances[0];
    const li = document.createElement("li");
    li.className = "card";
    li.dataset.songId = item.id;

    const row1 = document.createElement("div");
    row1.className = "row1";
    const shown = item.appearances.filter((appearance) => {
      if (filters.setlistId) return appearance.setlistId === filters.setlistId;
      if (allowedDates) return allowedDates.has(appearance.setlistId);
      return true;
    });
    const sheet = filters.setlistId ? shown[0] : null;
    row1.innerHTML = `<span class="num">${(sheet?.songIndex ?? position) + 1}</span><span class="title"></span>`;
    row1.querySelector(".title").textContent = sheet?.title || item.title;
    li.appendChild(row1);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = item.artist;
    li.appendChild(meta);

    const keys = document.createElement("div");
    keys.className = "keys";
    const keySource = shown.length ? shown : item.appearances;
    const uniqueKeys = keySource.length
      ? [...new Set(keySource.map((a) => playedLabel(a.assignedKey, state.transpositions[`${a.setlistId}:${item.id}`] ?? 0)))]
      : [playedLabel(item.assignedKey, state.transpositions[`general:${item.id}`] ?? 0)];
    keys.innerHTML = uniqueKeys.map((k) => `<span class="badge">Tono <span class="k">${k}</span></span>`).join("");
    li.appendChild(keys);
    renderSongAssignments(li, item);

    const actions = document.createElement("div");
    actions.className = "actions";
    const openBtn = document.createElement("button");
    openBtn.type = "button";
    openBtn.className = "primary";
    if (!item.hasChart) {
      openBtn.textContent = "Partitura no disponible";
      openBtn.disabled = true;
    } else if (!main) {
      openBtn.textContent = "Abrir partitura";
      openBtn.addEventListener("click", () => openLibrarySong(item.id, openBtn));
    } else {
      openBtn.textContent = "Abrir partitura";
      openBtn.addEventListener("click", () => openStageAt(main.setlistIndex, main.songIndex, openBtn, true));
    }
    actions.appendChild(openBtn);

    const lyricKey = main ? appearanceKey(main.setlistId, item.id) : appearanceKey("general", item.id);
    const lyricBtn = document.createElement("button");
    lyricBtn.type = "button";
    lyricBtn.textContent = lyricsStore.has(lyricKey) ? "Editar letra" : "Agregar letra";
    lyricBtn.addEventListener("click", () => openLyricsDialog(lyricKey, lyricBtn));
    actions.appendChild(lyricBtn);

    actions.appendChild(externalLink("Cifra Club", item.chartUrl));
    actions.appendChild(externalLink("Letra completa", item.lyricsUrl));
    actions.appendChild(externalLink("YouTube", item.youtubeUrl));
    li.appendChild(actions);
    el.cards.appendChild(li);
  });
}

function commitListOrder(ids, focusSongId) {
  orderStore.save(activeSetlist(), ids);
  const selectedId = activeSetlist().songs[state.selectedSongIndex]?.id;
  rebuildLive();
  const sel = activeSetlist().songs.findIndex((s) => s.id === selectedId);
  if (sel >= 0) state = { ...state, selectedSongIndex: sel };
  renderList();
  if (focusSongId) el.cards.querySelector(`li[data-song-id="${CSS.escape(focusSongId)}"] .move`)?.focus();
  announce("Orden guardado");
}

function listSlots() {
  return [...el.cards.children].filter((node) => node.classList.contains("card") && !node.classList.contains("lifting"));
}

function renumberSlots(lifted) {
  let n = 1;
  for (const item of el.cards.children) {
    if (item.classList.contains("lifting")) continue;
    const target = item.classList.contains("placeholder") ? lifted : item;
    const num = target?.querySelector(".num");
    if (num) num.textContent = String(n);
    n += 1;
  }
}

function animateShift(mutate) {
  const nodes = [...el.cards.children].filter((node) => !node.classList.contains("lifting") && !node.classList.contains("placeholder"));
  const first = new Map(nodes.map((node) => [node, node.getBoundingClientRect()]));
  mutate();
  for (const node of nodes) {
    if (!node.isConnected) continue;
    const dy = first.get(node).top - node.getBoundingClientRect().top;
    if (!dy) continue;
    node.style.transition = "none";
    node.style.transform = `translateY(${dy}px)`;
    node.getBoundingClientRect();
    requestAnimationFrame(() => {
      node.style.transition = "";
      node.style.transform = "";
    });
  }
}

function bindReorder(button, card) {
  button.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || card.classList.contains("lifting")) return;
    event.preventDefault();
    button.focus();
    const startIds = [...el.cards.querySelectorAll("li.card")].map((item) => item.dataset.songId);
    const start = card.getBoundingClientRect();
    const offsetX = event.clientX - start.left;
    const offsetY = event.clientY - start.top;
    const placeholder = document.createElement("li");
    placeholder.className = "card placeholder";
    placeholder.style.height = `${start.height}px`;
    placeholder.dataset.songId = card.dataset.songId;
    card.before(placeholder);
    card.classList.add("lifting");
    card.style.width = `${start.width}px`;
    card.style.left = `${start.left}px`;
    card.style.top = `${start.top}px`;
    try { button.setPointerCapture(event.pointerId); } catch { /* el movimiento sigue por la ventana */ }

    const follow = (x, y) => {
      const maxX = Math.max(8, window.innerWidth - start.width - 8);
      const maxY = Math.max(8, window.innerHeight - 72);
      card.style.left = `${Math.min(Math.max(8, x), maxX)}px`;
      card.style.top = `${Math.min(Math.max(8, y), maxY)}px`;
    };
    const moveGap = (clientY) => {
      const slots = listSlots();
      const from = slots.indexOf(placeholder);
      let to = slots.length - 1;
      for (let i = 0; i < slots.length; i++) {
        if (slots[i] === placeholder) continue;
        const rect = slots[i].getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) { to = i; break; }
      }
      if (to === from) return;
      animateShift(() => {
        const next = listSlots();
        const target = next[to];
        if (!target || target === placeholder) return;
        if (to > from) el.cards.insertBefore(placeholder, target.nextSibling);
        else el.cards.insertBefore(placeholder, target);
        renumberSlots(card);
      });
    };
    const move = (ev) => {
      follow(ev.clientX - offsetX, ev.clientY - offsetY);
      moveGap(ev.clientY);
    };
    let ended = false;
    const finish = () => {
      if (ended) return;
      ended = true;
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", finish);
      window.removeEventListener("pointercancel", finish);
      const gap = placeholder.getBoundingClientRect();
      card.style.transition = "left 180ms ease, top 180ms ease";
      follow(gap.left, gap.top);
      const ids = listSlots().map((item) => item.dataset.songId);
      window.setTimeout(() => {
        card.classList.remove("lifting");
        card.style.cssText = "";
        if (placeholder.isConnected) placeholder.replaceWith(card);
        if (ids.join("|") !== startIds.join("|")) {
          commitListOrder(ids, card.dataset.songId);
        }
      }, 180);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", finish);
    window.addEventListener("pointercancel", finish);
  });
  button.addEventListener("keydown", (event) => {
    const cards = [...el.cards.querySelectorAll("li.card")];
    const fromIndex = cards.indexOf(card);
    let to = fromIndex;
    if (event.key === "ArrowUp") to = fromIndex - 1;
    else if (event.key === "ArrowDown") to = fromIndex + 1;
    else return;
    event.preventDefault();
    if (to < 0 || to >= cards.length || card.classList.contains("lifting")) return;
    const ids = reorderIds(cards.map((item) => item.dataset.songId), fromIndex, to);
    commitListOrder(ids, card.dataset.songId);
  });
}

/* ---- Render: setlist ---- */
function renderSetlist() {
  if (homeControls) homeControls.wrap.hidden = true;
  el.cards.innerHTML = "";
  const sl = activeSetlist();
  sl.songs.forEach((song, index) => {
    const li = document.createElement("li");
    li.className = "card" + (index === state.selectedSongIndex ? " selected" : "");
    li.dataset.songId = song.id;

    const row1 = document.createElement("div");
    row1.className = "row1";
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = String(index + 1);
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = song.title;
    const move = document.createElement("button");
    move.type = "button";
    move.className = "move";
    move.textContent = "Mover";
    move.setAttribute("aria-label", `Mover ${song.title}, posición ${index + 1}`);
    bindReorder(move, li);
    row1.append(num, title, move);
    li.appendChild(row1);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = song.artist;
    li.appendChild(meta);

    const keys = document.createElement("div");
    keys.className = "keys";
    const semis = transposeFor(song);
    const played = playedLabel(song.assignedKey, semis);
    keys.innerHTML =
      `<span class="badge">Tono <span class="k">${played}</span></span>` +
      (semis !== 0 ? `<span class="badge">Escrita <span class="k">${song.assignedKey}</span></span>` : "");
    li.appendChild(keys);
    renderSongAssignments(li, song);

    const actions = document.createElement("div");
    actions.className = "actions";

    const openBtn = document.createElement("button");
    openBtn.type = "button";
    openBtn.className = "primary";
    if (song.sourceStatus === "pending") {
      openBtn.textContent = "Partitura no disponible";
      openBtn.disabled = true;
    } else {
      openBtn.textContent = "Abrir partitura";
      openBtn.addEventListener("click", () => openStage(index, openBtn));
    }
    actions.appendChild(openBtn);

    const lyricBtn = document.createElement("button");
    lyricBtn.type = "button";
    lyricBtn.textContent = lyricsStore.has(keyFor(song)) ? "Editar letra" : "Agregar letra";
    lyricBtn.addEventListener("click", () => openLyricsDialog(keyFor(song), lyricBtn));
    actions.appendChild(lyricBtn);

    actions.appendChild(externalLink("Cifra Club", song.chartUrl));
    actions.appendChild(externalLink("Letra completa", song.lyricsUrl));
    actions.appendChild(externalLink("YouTube", song.youtubeUrl));

    li.appendChild(actions);
    el.cards.appendChild(li);
  });
}

function externalLink(label, url) {
  if (!url) {
    const span = document.createElement("span");
    span.className = "badge pending";
    span.textContent = `${label}: enlace no disponible`;
    return span;
  }
  const a = document.createElement("a");
  a.className = "badge";
  a.textContent = label;
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

/* ---- Stage ---- */
function openStage(index, opener) {
  openStageAt(state.activeSetlistIndex, index, opener, false);
}

/** Abre una canción de la lista general que todavía no tiene fecha. */
function openLibrarySong(songId, opener) {
  scrollBySetlist.home = window.scrollY;
  lastOpenerButton = opener ?? null;
  returnToHome = true;
  librarySongId = songId;
  state = { ...state, view: "stage", metronomeRunning: false };
  renderStage();
  el.setlistView.hidden = true;
  el.stageView.hidden = false;
  window.scrollTo(0, 0);
}

/** Abre el escenario en una aparición concreta (desde una reunión o desde el Home). */
function openStageAt(setlistIndex, songIndex, opener, fromHome) {
  librarySongId = null;
  scrollBySetlist[fromHome ? "home" : state.activeSetlistIndex] = window.scrollY;
  lastOpenerButton = opener ?? null;
  returnToHome = Boolean(fromHome);
  state = { ...selectSong(selectSetlist(state, setlistIndex, liveSetlists.length - 1), songIndex, liveSetlists[setlistIndex].songs.length - 1), view: "stage" };
  renderStage();
  el.setlistView.hidden = true;
  el.stageView.hidden = false;
  window.scrollTo(0, 0);
}

function backToSetlist() {
  stopMetronome();
  destroyVideo();
  hideChordPopover();
  void exitStageFullscreen(); // el listado vive fuera de #stageView
  state = { ...state, view: "setlist", home: returnToHome };
  librarySongId = null;
  el.stageView.hidden = true;
  el.setlistView.hidden = false;
  renderMeetingSelect();
  renderList();
  window.scrollTo(0, scrollBySetlist[returnToHome ? "home" : state.activeSetlistIndex] ?? 0);
  if (lastOpenerButton && document.contains(lastOpenerButton)) lastOpenerButton.focus();
}

function renderStage() {
  const song = selectedSong();
  const inLibrary = Boolean(librarySongId);
  const sl = inLibrary ? { id: "general", songs: [song] } : activeSetlist();
  const semis = transposeFor(song);
  const chordSemis = semis + chartSemis(song);
  hideChordPopover();
  el.stageView.innerHTML = "";

  const toolbar = document.createElement("div");
  toolbar.className = "toolbar";
  const back = button("Volver al setlist", () => backToSetlist());
  const pos = document.createElement("span");
  pos.className = "position";
  pos.textContent = inLibrary ? "Lista general" : `${state.selectedSongIndex + 1} de ${sl.songs.length}`;
  const fs = button("Pantalla completa", toggleFullscreen);
  fs.id = "fullscreenBtn";
  // Alternar grilla de compases / recuadros sin salir del escenario.
  const isGrid = (state.chartLayout ?? "grid") === "grid";
  const layoutBtn = button(
    isGrid ? "Vista: grilla" : "Vista: lista",
    () => { state = { ...state, chartLayout: isGrid ? "flow" : "grid" }; renderStage(); },
    isGrid ? "Cambiar a vista de lista" : "Cambiar a vista de grilla de compases"
  );
  layoutBtn.setAttribute("aria-pressed", String(isGrid));
  const degreeFirst = (state.chordLabel ?? "note") === "degree";
  const labelMode = button(
    degreeFirst ? "Grado · nota" : "Nota · grado",
    () => {
      state = { ...state, chordLabel: degreeFirst ? "note" : "degree" };
      renderStage();
      announce(degreeFirst ? "Nota con el grado en subíndice" : "Grado con la nota en subíndice");
    },
    degreeFirst ? "Mostrar la nota y el grado como subíndice" : "Mostrar el grado y la nota como subíndice"
  );
  labelMode.setAttribute("aria-pressed", String(degreeFirst));
  const simplifySelect = document.createElement("select");
  simplifySelect.setAttribute("aria-label", "Simplificar acordes");
  for (const level of SIMPLIFY_LEVELS) {
    const opt = document.createElement("option");
    opt.value = level;
    opt.textContent = `Acordes: ${SIMPLIFY_LABELS[level]}`;
    if ((state.simplify ?? "none") === level) opt.selected = true;
    simplifySelect.appendChild(opt);
  }
  simplifySelect.addEventListener("change", () => {
    state = { ...state, simplify: simplifySelect.value };
    renderStage();
    announce(`Acordes ${SIMPLIFY_LABELS[simplifySelect.value].toLowerCase()}`);
  });
  toolbar.append(back, pos, layoutBtn, labelMode, simplifySelect, fs);
  el.stageView.appendChild(toolbar);

  const h2 = document.createElement("h2");
  h2.textContent = song.title;
  el.stageView.appendChild(h2);

  const artist = document.createElement("div");
  artist.className = "meta";
  artist.textContent = song.artist;
  el.stageView.appendChild(artist);

  // Enlaces externos de la canción (nueva pestaña; no se extrae contenido).
  const links = document.createElement("div");
  links.className = "actions";
  links.style.margin = "8px 0";
  links.appendChild(externalLink("Cifra Club", song.chartUrl));
  links.appendChild(externalLink("YouTube", song.youtubeUrl));
  el.stageView.appendChild(links);

  // Key line + transpose controls
  const keyline = document.createElement("div");
  keyline.className = "keyline";
  keyline.innerHTML =
    `<span class="badge">Asignada <span class="k">${song.assignedKey}</span></span>` +
    `<span class="badge">Actual <span class="k" id="currentKeyBadge">${currentKey(song)}</span></span>`;
  const controls = document.createElement("div");
  controls.className = "transpose-controls";
  controls.append(
    button("−½", () => applyTranspose(song, semis - 1), "Bajar medio tono"),
    button("+½", () => applyTranspose(song, semis + 1), "Subir medio tono"),
    keySelect(song),
    accidentalSelect(),
    button("Restablecer tono", () => applyTranspose(song, 0))
  );
  keyline.appendChild(controls);

  // Capo: sugerencia automática (práctica de worship: capo en vez de cejillas)
  // sobre los acordes que suenan con la transposición actual, o el capo fijado
  // a mano para esta aparición. Con capo, la partitura muestra las FORMAS que se
  // digitan; el grado (subíndice) es siempre el del tono real, invariante al capo.
  // Acordes transpuestos y, si se pidió, simplificados (menos acordes de paso).
  const transposed = simplifySections(
    song.sections.length ? transposeSections(song.sections, chordSemis, chordSpelling(song, semis)) : [],
    state.simplify ?? "none"
  );
  const soundingChords = [...new Set(transposed.flatMap((s) => s.measures.flat()))];
  stageKeyRoot = currentKey(song);
  const suggestion = suggestCapo(stageKeyRoot, transposeChord, soundingChords);
  // Capo del arreglo de la banda (dato de la canción), válido sólo en el tono
  // original: si se transpone, el capo fijo dejaría de tener sentido.
  const arrangementCapo = chordSemis === 0 && song.capo != null ? song.capo : null;
  const autoCapo = arrangementCapo ?? suggestion.capo;
  const autoRoot = shapeForCapo(stageKeyRoot, autoCapo, transposeChord);
  const override = state.capoOverrides?.[keyFor(song)];
  const manualCapo = override !== undefined && override !== null;
  stageCapo = manualCapo ? override : autoCapo;
  const shapeRoot = shapeForCapo(stageKeyRoot, stageCapo, transposeChord);

  const capoSelect = document.createElement("select");
  capoSelect.setAttribute("aria-label", "Capo");
  const autoOpt = document.createElement("option");
  autoOpt.value = "auto";
  autoOpt.textContent = autoCapo
    ? `Capo ${arrangementCapo != null ? "del arreglo" : "automático"} (${autoCapo}, en ${autoRoot})`
    : "Capo automático (sin capo)";
  capoSelect.appendChild(autoOpt);
  for (let c = 0; c <= 11; c++) {
    const opt = document.createElement("option");
    opt.value = String(c);
    opt.textContent = c === 0 ? "Sin capo" : `Capo ${c} · digitás en ${shapeForCapo(stageKeyRoot, c, transposeChord)}`;
    capoSelect.appendChild(opt);
  }
  capoSelect.value = manualCapo ? String(override) : "auto";
  capoSelect.addEventListener("change", () => {
    const v = capoSelect.value;
    state = setCapo(state, contextSetlistId(), song.id, v === "auto" ? null : Number(v));
    renderStage();
    announce(v === "auto" ? "Capo automático" : Number(v) ? `Capo ${v}: la partitura muestra las formas` : "Sin capo");
  });
  keyline.appendChild(capoSelect);

  const capoHint = document.createElement("span");
  capoHint.className = "badge capo-hint";
  if (manualCapo) {
    capoHint.textContent = stageCapo ? `Capo ${stageCapo} · digitás en ${shapeRoot} · suena en ${stageKeyRoot}` : "Sin capo";
  } else if (arrangementCapo != null) {
    capoHint.textContent = arrangementCapo
      ? `Capo ${arrangementCapo} (arreglo de la banda) · digitás en ${autoRoot} · suena en ${stageKeyRoot}`
      : "Sin capo (arreglo de la banda)";
  } else {
    capoHint.textContent = suggestion.capo
      ? `Capo sugerido: ${suggestion.capo} · digitás en ${suggestion.shapeRoot}${suggestion.barres === 0 ? " · sin cejillas" : ""}`
      : "Tonalidad abierta · sin capo";
  }
  keyline.appendChild(capoHint);

  // Compases por línea (2 / 4 / 8): dato de la canción, ajustable en sesión.
  const lineOverride = state.lineOverrides?.[keyFor(song)];
  stageBarsPerLine = lineOverride ?? song.barsPerLine ?? 4;
  const lineSelect = document.createElement("select");
  lineSelect.setAttribute("aria-label", "Compases por línea");
  for (const n of BARS_PER_LINE_OPTIONS) {
    const opt = document.createElement("option");
    opt.value = String(n);
    opt.textContent = `${n} compases por línea${n === (song.barsPerLine ?? 4) ? " (canción)" : ""}`;
    if (n === stageBarsPerLine) opt.selected = true;
    lineSelect.appendChild(opt);
  }
  lineSelect.addEventListener("change", () => {
    const n = Number(lineSelect.value);
    state = setBarsPerLine(state, contextSetlistId(), song.id, n === (song.barsPerLine ?? 4) ? null : n);
    renderStage();
    announce(`${n} compases por línea`);
  });
  keyline.appendChild(lineSelect);
  el.stageView.appendChild(keyline);

  // Sections
  if (song.sections.length === 0) {
    const p = document.createElement("p");
    p.className = "pending";
    p.textContent = "Partitura no disponible.";
    el.stageView.appendChild(p);
  } else {
    // 1) Estructura: recorrido en orden con repeticiones e indicaciones.
    // 2) Bloques únicos: cada secuencia de acordes una sola vez, con todas las
    //    secciones que la usan. Con capo se leen las formas; el popover y el
    //    grado siempre parten del acorde real (sounding).
    const structure = songStructure(transposed);
    el.stageView.appendChild(renderRoadmap(structure));
    const ol = document.createElement("ol");
    ol.className = "sections";
    structure.blocks.forEach((block) => {
      const shapes = stageCapo
        ? transposeSections([{ measures: block.measures }], -stageCapo, "sharp")[0].measures
        : block.measures;
      const li = renderSection({ label: block.title, repeats: 1, measures: shapes }, { measures: block.measures }, stageKeyRoot);
      li.id = `block-${block.id}`;
      if (block.occurrences.length > 1) {
        const uses = document.createElement("span");
        uses.className = "uses";
        uses.textContent = `aparece ${block.occurrences.length} veces`;
        li.querySelector(".slabel")?.appendChild(uses);
      }
      ol.appendChild(li);
    });
    el.stageView.appendChild(ol);
  }

  el.stageView.appendChild(renderLyricsPanel(song));
  el.stageView.appendChild(renderVideoPanel(song));
  el.stageView.appendChild(renderMetronomePanel(song));

  // Prev / next
  const nav = document.createElement("div");
  nav.className = "nav-row";
  const prev = button("← Anterior", () => stepSong(-1));
  prev.disabled = inLibrary || state.selectedSongIndex === 0;
  const next = button("Siguiente →", () => stepSong(1));
  next.disabled = inLibrary || state.selectedSongIndex === sl.songs.length - 1;
  nav.append(prev, next);
  el.stageView.appendChild(nav);
}

/** Recorrido de la canción: "Contiene: …" + chips en orden que llevan a su bloque. */
function renderRoadmap(structure) {
  const wrap = document.createElement("section");
  wrap.className = "roadmap";
  wrap.setAttribute("aria-label", "Estructura de la canción");
  const h3 = document.createElement("h3");
  h3.textContent = "Estructura";
  wrap.appendChild(h3);
  const summary = document.createElement("p");
  summary.className = "hint";
  summary.textContent = `Contiene: ${structureSummary(structure.typeSummary)}`;
  wrap.appendChild(summary);

  const ol = document.createElement("ol");
  ol.className = "road";
  const reduced = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  structure.roadmap.forEach((step) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "step";
    b.textContent = step.displayLabel + (step.repeats > 1 ? ` ×${step.repeats}` : "");
    if (step.cue) {
      const c = document.createElement("span");
      c.className = "cue";
      c.textContent = step.cue;
      b.appendChild(c);
    }
    b.setAttribute("aria-label",
      `${step.displayLabel}${step.repeats > 1 ? `, ${step.repeats} veces` : ""}${step.cue ? `, ${step.cue}` : ""}: ir a sus acordes`);
    b.addEventListener("click", () => {
      const target = document.getElementById(`block-${step.blockId}`);
      if (!target) return;
      target.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
      target.classList.add("flash");
      setTimeout(() => target.classList.remove("flash"), 1200);
    });
    li.appendChild(b);
    ol.appendChild(li);
  });
  wrap.appendChild(ol);
  return wrap;
}

/**
 * @param section  sección a MOSTRAR (formas, si hay capo)
 * @param sounding misma sección con los acordes reales (para grado y popover)
 * @param keyRoot  tono real vigente, para el grado
 */
function renderSection(section, sounding = section, keyRoot = stageKeyRoot) {
  const li = document.createElement("li");
  li.className = "section";
  const label = document.createElement("div");
  label.className = "slabel";
  label.innerHTML = `<span></span>` + (section.repeats > 1 ? `<span class="repeats">× ${section.repeats}</span>` : "");
  label.querySelector("span").textContent = section.label;
  // Indicación de arreglo (instrumentación/dinámica) aportada por Darío; sin
  // dato, no se muestra nada. Sobrevive a transposición y capo (spread).
  if (section.cue) {
    const cue = document.createElement("span");
    cue.className = "cue";
    cue.textContent = section.cue;
    label.appendChild(cue);
  }
  li.appendChild(label);

  const grid = (state.chartLayout ?? "grid") === "grid";
  const perLine = stageBarsPerLine;
  const soundingMeasures = sounding.measures ?? section.measures;

  function appendRows(parent, slice, soundSlice, fill) {
    const rows = chunkMeasures(slice, perLine);
    let measures = null;
    slice.forEach((measure, mi) => {
      if (mi % perLine === 0) {
        measures = document.createElement("div");
        measures.className = grid ? "bars" : "measures";
        measures.style.setProperty("--per-line", String(perLine));
        measures.setAttribute("role", "group");
        measures.setAttribute("aria-label", `Línea ${Math.floor(mi / perLine) + 1} de ${rows.length}`);
        parent.appendChild(measures);
      }
      const m = document.createElement("div");
      m.className = grid ? "bar" : "measure";
      // En la grilla cada compás reparte su ancho entre sus acordes: 1 = todo el
      // compás, 2 = mitad y mitad, 3–4 = por tiempo.
      if (grid) m.style.gridTemplateColumns = `repeat(${measure.length}, minmax(0, 1fr))`;
      measure.forEach((shape, ci) => {
        const real = soundSlice[mi]?.[ci] ?? shape;
        const degree = chordToDegree(real, keyRoot);
        const degreeFirst = (state.chordLabel ?? "note") === "degree" && Boolean(degree);
        // Cada acorde es un botón: tap/clic muestra cómo digitarlo.
        // Por defecto el texto es la nota (forma a digitar) y el subíndice el grado.
        // El toggle invierte: grado grande, nota en el subíndice.
        const c = document.createElement("button");
        c.type = "button";
        c.className = "chord";
        c.textContent = degreeFirst ? degree : shape;
        const subText = degreeFirst ? shape : degree;
        if (subText) {
          const sub = document.createElement("sub");
          sub.className = "deg";
          sub.textContent = subText;
          c.appendChild(sub);
        }
        const suena = shape !== real ? `, suena ${real}` : "";
        c.setAttribute(
          "aria-label",
          degreeFirst
            ? `Grado ${degree}, nota ${shape}${suena}: ver cómo tocarlo`
            : `Acorde ${shape}${degree ? `, grado ${degree}` : ""}${suena}: ver cómo tocarlo`
        );
        c.setAttribute("aria-haspopup", "dialog");
        c.setAttribute("aria-expanded", "false");
        attachChordPopover(c, real);
        m.appendChild(c);
      });
      measures.appendChild(m);
    });
    // La última fila incompleta mantiene el ancho de columna: en la grilla lo da
    // el grid de N columnas; en la lista, se rellena con celdas vacías.
    if (fill && !grid && measures && slice.length % perLine) {
      for (let k = slice.length % perLine; k < perLine; k++) {
        const filler = document.createElement("div");
        filler.className = "measure filler";
        filler.setAttribute("aria-hidden", "true");
        measures.appendChild(filler);
      }
    }
  }

  for (const span of repeatedPatternSpans(section.measures)) {
    const slice = section.measures.slice(span.start, span.start + span.length);
    const soundSlice = soundingMeasures.slice(span.start, span.start + span.length);
    if (span.repeats > 1) {
      const pattern = document.createElement("div");
      pattern.className = "pattern";
      pattern.setAttribute("role", "group");
      pattern.setAttribute("aria-label", `${slice.map((m) => m.join(" ")).join(", ")}, ${span.repeats} veces`);
      const body = document.createElement("div");
      body.className = "pattern-body";
      appendRows(body, slice, soundSlice, false);
      const badge = document.createElement("span");
      badge.className = "repeats";
      badge.textContent = `× ${span.repeats}`;
      pattern.append(body, badge);
      li.appendChild(pattern);
    } else {
      appendRows(li, slice, soundSlice, true);
    }
  }
  return li;
}

function keySelect(song) {
  const select = document.createElement("select");
  select.setAttribute("aria-label", "Elegir tonalidad");
  const table = state.accidentalMode === "flat"
    ? ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"]
    : CHROMATIC;
  const assignedIdx = keyToPitchClass(song.assignedKey);
  table.forEach((name, idx) => {
    const opt = document.createElement("option");
    opt.value = String(idx);
    opt.textContent = name;
    if (assignedIdx !== null && ((assignedIdx + transposeFor(song)) % 12 + 12) % 12 === idx) {
      opt.selected = true;
    }
    select.appendChild(opt);
  });
  select.addEventListener("change", () => {
    const targetIdx = Number(select.value);
    const assigned = keyToPitchClass(song.assignedKey);
    let semis = ((targetIdx - assigned) % 12 + 12) % 12;
    if (semis > 6) semis -= 12;
    applyTranspose(song, semis);
  });
  return select;
}

function accidentalSelect() {
  const select = document.createElement("select");
  select.setAttribute("aria-label", "Bemoles o sostenidos");
  [["sharp", "Sostenidos (♯)"], ["flat", "Bemoles (♭)"]].forEach(([value, text]) => {
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = text;
    if (state.accidentalMode === value) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => {
    state = { ...state, accidentalMode: select.value };
    renderStage();
  });
  return select;
}

function applyTranspose(song, semitones) {
  state = setTranspose(state, contextSetlistId(), song.id, semitones);
  writeKeyOverrides(state.transpositions);
  renderStage();
  announce(`Tonalidad actual: ${currentKey(song)}`);
}

function stepSong(delta) {
  stopMetronome();
  destroyVideo();
  state = moveSong(state, delta, activeSetlist().songs.length - 1);
  renderStage();
  window.scrollTo(0, 0);
}

/* ---- Lyrics panel & dialog ---- */
function renderLyricsPanel(song) {
  const panel = document.createElement("div");
  panel.className = "panel";
  const key = keyFor(song);
  const stored = lyricsStore.get(key);
  const bundled = typeof song.lyrics === "string" && song.lyrics.trim() ? song.lyrics : null;
  const text = stored ?? bundled;
  const h3 = document.createElement("h3");
  h3.textContent = "Letra";
  panel.appendChild(h3);

  if (text) {
    const body = document.createElement("div");
    body.className = "lyrics-text";
    body.textContent = text;
    panel.appendChild(body);
  } else {
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "No hay letra local. Podés agregar una que hayas aportado o usar el enlace externo.";
    panel.appendChild(hint);
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  actions.appendChild(button(text ? "Editar letra" : "Agregar letra", () => openLyricsDialog(key)));
  if (text) {
    actions.appendChild(button("Eliminar letra", () => {
      if (confirm("¿Eliminar la letra local de esta canción?")) {
        lyricsStore.remove(key);
        renderStage();
        announce("Letra eliminada");
      }
    }));
  }
  actions.appendChild(button("Exportar letras", exportLyrics));
  const importLabel = document.createElement("label");
  importLabel.className = "badge";
  importLabel.textContent = "Importar respaldo ";
  const importInput = document.createElement("input");
  importInput.type = "file";
  importInput.accept = "application/json,.json";
  importInput.style.maxWidth = "12em";
  importInput.addEventListener("change", () => importLyrics(importInput));
  importLabel.appendChild(importInput);
  actions.appendChild(importLabel);
  actions.appendChild(externalLink("Letra completa", song.lyricsUrl));
  panel.appendChild(actions);

  if (!lyricsStore.persistent) {
    const warn = document.createElement("p");
    warn.className = "hint err";
    warn.textContent = "La letra estará disponible sólo durante esta sesión.";
    panel.appendChild(warn);
  }
  return panel;
}

function openLyricsDialog(key, opener) {
  dialogTargetKey = key;
  lastOpenerButton = opener ?? lastOpenerButton;
  el.textarea.value = lyricsStore.get(key) ?? "";
  el.dialogError.textContent = "";
  if (typeof el.dialog.showModal === "function") el.dialog.showModal();
}

el.lyricsCancel.addEventListener("click", () => el.dialog.close());
el.lyricsSave.addEventListener("click", () => {
  const text = el.textarea.value;
  const result = validateLyricText(text);
  if (!result.ok) {
    el.dialogError.textContent = result.error;
    return;
  }
  const persisted = lyricsStore.set(dialogTargetKey, text);
  el.dialog.close();
  if (state.view === "stage") renderStage(); else renderList();
  announce(persisted ? "Letra guardada" : "Letra guardada sólo para esta sesión");
});
el.lyricsFile.addEventListener("change", () => {
  const file = el.lyricsFile.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result ?? "");
    const result = validateLyricText(text);
    if (!result.ok) { el.dialogError.textContent = result.error; return; }
    el.textarea.value = text;
    el.dialogError.textContent = "";
  };
  reader.onerror = () => { el.dialogError.textContent = "No se pudo leer el archivo"; };
  reader.readAsText(file, "utf-8");
});

function exportLyrics() {
  const json = serializeLyricsBackup(lyricsStore.all());
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `worship-setlist-lyrics-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  announce("Respaldo de letras exportado");
}

function importLyrics(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const parsed = parseLyricsBackup(String(reader.result ?? ""), allAppearanceKeys());
    if (Object.keys(parsed.lyrics).length === 0) {
      announce("No se importaron letras válidas");
      return;
    }
    const { merged, collisions } = mergeLyrics(lyricsStore.all(), parsed.lyrics);
    if (collisions.length && !confirm(`Se sobrescribirán ${collisions.length} letra(s) existente(s). ¿Continuar?`)) {
      // Import only non-colliding entries.
      const safe = { ...lyricsStore.all() };
      for (const [k, v] of Object.entries(parsed.lyrics)) if (!(k in safe)) safe[k] = v;
      lyricsStore.replaceAll(safe);
    } else {
      lyricsStore.replaceAll(merged);
    }
    if (state.view === "stage") renderStage(); else renderList();
    announce(`Letras importadas${parsed.errors.length ? ` (${parsed.errors.length} omitidas)` : ""}`);
  };
  reader.readAsText(file, "utf-8");
  input.value = "";
}

function renderVideoPanel(song) {
  const panel = document.createElement("div");
  panel.className = "panel";
  const h3 = document.createElement("h3");
  h3.textContent = "Video oficial";
  panel.appendChild(h3);

  const container = document.createElement("div");
  container.id = "youtubeContainer";
  panel.appendChild(container);

  const actions = document.createElement("div");
  actions.className = "actions";

  loadBtn.type = "button";
  loadBtn.textContent = "Cargar video";
  loadBtn.disabled = !song.youtubeVideoId;
  loadBtn.addEventListener("click", () => loadVideo(song, container));
  actions.appendChild(loadBtn);
  actions.appendChild(externalLink("Abrir en YouTube", song.youtubeUrl));
  if (!song.youtubeVideoId) {
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = "Video no disponible.";
    actions.appendChild(hint);

function loadVideo(song, container) {
  try {
    const src = buildYouTubeEmbedUrl(song.youtubeVideoId);
    container.replaceChildren();
    const iframe = document.createElement("iframe");
    iframe.src = src;
    iframe.title = `Video oficial de ${song.title}`;
    iframe.loading = "lazy";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allow = "accelerometer; autoplay; encrypted-media; picture-in-picture";
    iframe.allowFullscreen = true;
    container.appendChild(iframe);
  } catch {
    announce("No se pudo cargar el video. Usá el enlace para abrirlo en YouTube.");
  }
}

function destroyVideo() {
  const container = document.getElementById("youtubeContainer");
  if (container) container.replaceChildren();
}

/* ---- Metronome ---- */
class MetronomeController {
  constructor() {
    this.ctx = null;
    this.timer = null;
    this.nextTime = 0;
    this.beat = 0;
    this.bpm = 120;
    this.meter = 4;
    this.volume = 0.6;
    this.muted = false;
    this.onBeat = null;
    this._running = false;
  }
  get running() { return this._running; }
  start({ bpm, beatsPerMeasure, volume, onBeat }) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) throw new Error("Web Audio API unavailable");
    if (!this.ctx) this.ctx = new Ctx();
    this.bpm = clampBpm(bpm);
    this.meter = normalizeMeter(beatsPerMeasure);
    if (typeof volume === "number") this.volume = volume;
    this.onBeat = onBeat ?? null;
    this.beat = -1;
    this.nextTime = this.ctx.currentTime + 0.1;
    this._running = true;
    this.timer = setInterval(() => this._schedule(), 25);
  }
  _schedule() {
    if (!this.ctx) return;
    while (this.nextTime < this.ctx.currentTime + 0.1) {
      const { beat, accented } = advanceBeat(this.beat, this.meter);
      this.beat = beat;
      this._click(this.nextTime, accented);
      if (this.onBeat) this.onBeat(beat, accented);
      this.nextTime += secondsPerBeat(this.bpm);
    }
  }
  _click(time, accented) {
    if (this.muted || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.frequency.value = accented ? 1200 : 800;
    gain.gain.setValueAtTime(this.volume, time);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(time);
    osc.stop(time + 0.03);
  }
  stop() {
    this._running = false;
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
  }
  setBpm(bpm) { this.bpm = clampBpm(bpm); }
  setMeter(m) { this.meter = normalizeMeter(m); }
  setVolume(v) { this.volume = Math.max(0, Math.min(1, v)); }
  setMuted(m) { this.muted = !!m; }
}

function renderMetronomePanel(song) {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.id = "metronomePanel";
  const h3 = document.createElement("h3");
  h3.textContent = "Metrónomo";
  panel.appendChild(h3);

  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) {
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = "Metrónomo no disponible.";
    panel.appendChild(p);
    return panel;
  }

  const key = keyFor(song);
  const bpm = state.tempoOverrides[key] ?? song.tempoBpm ?? 120;
  const meter = state.meterOverrides[key] ?? song.beatsPerMeasure ?? 4;
  const unset = song.tempoBpm == null && state.tempoOverrides[key] == null;

  const controls = document.createElement("div");
  controls.className = "metronome-controls";

  const bpmInput = document.createElement("input");
  bpmInput.type = "number";
  bpmInput.min = "40"; bpmInput.max = "240"; bpmInput.value = String(clampBpm(bpm));
  bpmInput.setAttribute("aria-label", "Tempo en BPM");

  const label = document.createElement("span");
  label.className = "hint";
  label.textContent = unset ? "Tempo sin configurar" : "BPM";

  const setBpm = (v) => {
    const value = clampBpm(v);
    bpmInput.value = String(value);
    state = { ...state, tempoOverrides: { ...state.tempoOverrides, [key]: value } };
    label.textContent = "BPM";
    metronome?.setBpm(value);
    announce(`Tempo ${value} BPM`);
  };
  bpmInput.addEventListener("change", () => setBpm(bpmInput.value));

  const meterSelect = document.createElement("select");
  meterSelect.setAttribute("aria-label", "Compás");
  [2, 3, 4, 6].forEach((n) => {
    const opt = document.createElement("option");
    opt.value = String(n); opt.textContent = `${n}/4`;
    if (n === normalizeMeter(meter)) opt.selected = true;
    meterSelect.appendChild(opt);
  });
  meterSelect.addEventListener("change", () => {
    const m = normalizeMeter(Number(meterSelect.value));
    state = { ...state, meterOverrides: { ...state.meterOverrides, [key]: m } };
    metronome?.setMeter(m);
  });

  const startBtn = document.createElement("button");
  startBtn.type = "button";
  startBtn.textContent = "Iniciar";
  startBtn.addEventListener("click", () => {
    if (metronome?.running) {
      stopMetronome();
      startBtn.textContent = "Iniciar";
    } else {
      startMetronome(clampBpm(bpmInput.value), normalizeMeter(Number(meterSelect.value)), volumeInput.valueAsNumber, muteBtn.getAttribute("aria-pressed") === "true");
      startBtn.textContent = "Detener";
      announce("Metrónomo iniciado");
    }
  });

  const volumeInput = document.createElement("input");
  volumeInput.type = "range";
  volumeInput.min = "0"; volumeInput.max = "1"; volumeInput.step = "0.05"; volumeInput.value = "0.6";
  volumeInput.setAttribute("aria-label", "Volumen del metrónomo");
  volumeInput.addEventListener("input", () => metronome?.setVolume(volumeInput.valueAsNumber));

  const muteBtn = document.createElement("button");
  muteBtn.type = "button";
  muteBtn.textContent = "Silenciar";
  muteBtn.setAttribute("aria-pressed", "false");
  muteBtn.addEventListener("click", () => {
    const muted = muteBtn.getAttribute("aria-pressed") !== "true";
    muteBtn.setAttribute("aria-pressed", String(muted));
    muteBtn.textContent = muted ? "Activar sonido" : "Silenciar";
    metronome?.setMuted(muted);
  });

  controls.append(
    button("−1", () => setBpm(Number(bpmInput.value) - 1), "Bajar 1 BPM"),
    bpmInput, label,
    button("+1", () => setBpm(Number(bpmInput.value) + 1), "Subir 1 BPM"),
    meterSelect, startBtn, volumeInput, muteBtn
  );
  panel.appendChild(controls);
  return panel;
}

function startMetronome(bpm, meter, volume, muted) {
  try {
    if (!metronome) metronome = new MetronomeController();
    metronome.setMuted(muted);
    metronome.start({ bpm, beatsPerMeasure: meter, volume });
    state = { ...state, metronomeRunning: true };
  } catch {
    announce("Metrónomo no disponible");
  }
}
function stopMetronome() {
  if (metronome?.running) {
    metronome.stop();
    state = { ...state, metronomeRunning: false };
  }
}

/* ---- Pantalla completa ----
   Fullscreen API sobre #stageView; si el navegador no la ofrece o la rechaza
   (p. ej. Safari en iPhone), modo "pseudo" equivalente: overlay fijo con scroll
   propio y Escape para salir. En ambos casos #stageView es el contenedor con
   scroll y el popover se mueve adentro (fuera del elemento no se vería). */
const PSEUDO_FS = "pseudo-fullscreen";

function isStageFullscreen() {
  return document.fullscreenElement === el.stageView
    || document.webkitFullscreenElement === el.stageView
    || el.stageView.classList.contains(PSEUDO_FS);
}

function updateFullscreenButton() {
  const btn = document.getElementById("fullscreenBtn");
  if (btn) btn.textContent = isStageFullscreen() ? "Salir de pantalla completa" : "Pantalla completa";
}

function setPseudoFullscreen(on) {
  el.stageView.classList.toggle(PSEUDO_FS, on);
  document.body.classList.toggle("pseudo-fullscreen-open", on);
  hideChordPopover();
  updateFullscreenButton();
  if (on) announce("Pantalla completa. Escape o el botón para salir.");
}

async function toggleFullscreen() {
  if (isStageFullscreen()) {
    await exitStageFullscreen();
    return;
  }
  try {
    if (el.stageView.requestFullscreen) await el.stageView.requestFullscreen();
    else if (el.stageView.webkitRequestFullscreen) el.stageView.webkitRequestFullscreen();
    else setPseudoFullscreen(true);
  } catch {
    setPseudoFullscreen(true); // sin API o solicitud rechazada: modo pseudo
  }
}

async function exitStageFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  } catch { /* nada que salir */ }
  if (el.stageView.classList.contains(PSEUDO_FS)) setPseudoFullscreen(false);
}

for (const ev of ["fullscreenchange", "webkitfullscreenchange"]) {
  document.addEventListener(ev, () => {
    hideChordPopover(); // las coordenadas cambian con el modo
    updateFullscreenButton();
  });
}

/* ---- Popover de digitación: sólo por tap/clic (sin hover ni foco) ----
   Decisión de Darío: en escenario el popover no debe aparecer al mover el
   puntero. Con teclado, Enter/Espacio sobre el acorde disparan el clic. */
function attachChordPopover(btn, chord) {
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (popoverTrigger === btn) hideChordPopover(); // segundo tap: cierra
    else showChordPopover(btn, chord);
  });
}

function showChordPopover(btn, chord) {
  if (popoverTrigger && popoverTrigger !== btn) popoverTrigger.setAttribute("aria-expanded", "false");
  popoverTrigger = btn;
  btn.setAttribute("aria-expanded", "true");
  el.popover.replaceChildren(...buildChordPopoverContent(chord));
  el.popover.hidden = false;
  positionPopover(btn);
}

function hideChordPopover() {
  el.popover.hidden = true;
  if (popoverTrigger) popoverTrigger.setAttribute("aria-expanded", "false");
  popoverTrigger = null;
}

function positionPopover(btn) {
  const pop = el.popover;
  const r = btn.getBoundingClientRect();
  const width = pop.offsetWidth || 240;
  const inStage = isStageFullscreen();
  // En pantalla completa el popover debe vivir DENTRO de #stageView (lo que
  // queda fuera del elemento fullscreen no se ve) y posicionarse relativo a
  // él, que es fijo y tiene su propio scroll.
  const container = inStage ? el.stageView : document.body;
  if (pop.parentElement !== container) container.appendChild(pop);
  if (inStage) {
    const s = el.stageView.getBoundingClientRect();
    const maxLeft = el.stageView.clientWidth - width - 8;
    let left = r.left - s.left + el.stageView.scrollLeft + r.width / 2 - width / 2;
    left = Math.max(8, Math.min(left, maxLeft));
    pop.style.left = `${left}px`;
    pop.style.top = `${r.bottom - s.top + el.stageView.scrollTop + 8}px`;
  } else {
    const viewport = document.documentElement.clientWidth;
    let left = r.left + window.scrollX + r.width / 2 - width / 2;
    left = Math.max(window.scrollX + 8, Math.min(left, window.scrollX + viewport - width - 8));
    pop.style.left = `${left}px`;
    pop.style.top = `${r.bottom + window.scrollY + 8}px`;
  }
}

document.addEventListener("click", (e) => {
  if (!el.popover.hidden && !el.popover.contains(e.target)) hideChordPopover();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!el.popover.hidden) {
    const trigger = popoverTrigger;
    hideChordPopover();
    trigger?.focus();
  } else if (el.stageView.classList.contains("pseudo-fullscreen")) {
    setPseudoFullscreen(false); // Escape sale del modo pseudo (la API real ya lo hace sola)
  }
});

function buildChordPopoverContent(sounding) {
  const title = document.createElement("h4");
  title.id = "chordPopoverTitle";
  const cap = document.createElement("p");
  cap.className = "cap";
  const nodes = [title, cap];

  if (sounding === "N.C.") {
    title.textContent = "N.C.";
    cap.textContent = "Sin acorde.";
    return nodes;
  }

  const shape = shapeForCapo(sounding, stageCapo, transposeChord);
  const degree = chordToDegree(sounding, stageKeyRoot);
  const grado = degree ? ` · grado ${degree}` : "";
  title.textContent = shape;
  cap.textContent = stageCapo
    ? `Con capo ${stageCapo}: digitás ${shape}, suena ${sounding}${grado}.`
    : `Sin capo${grado}.`;

  const v = findVoicing(shape);
  if (!v) {
    const p = document.createElement("p");
    p.className = "pending";
    p.textContent = "Digitación no disponible.";
    nodes.push(p);
    return nodes;
  }
  nodes.push(renderChordDiagram(v));
  const frets = document.createElement("p");
  frets.className = "frets";
  frets.textContent = `Trastes (grave → agudo): ${v.frets.join(" ")}`;
  nodes.push(frets);
  if (v.note) {
    const n = document.createElement("p");
    n.className = "cap";
    n.textContent = v.note;
    nodes.push(n);
  }
  return nodes;
}

/** Diagrama de acorde en SVG: 6 cuerdas (grave a la izquierda), 5 trastes. */
function renderChordDiagram(v) {
  const NS = "http://www.w3.org/2000/svg";
  const fretted = v.frets.filter((f) => f !== "x" && f > 0);
  const maxFret = fretted.length ? Math.max(...fretted) : 0;
  const baseFret = maxFret > 4 ? Math.min(...fretted) : 1;
  const W = 200, H = 220, left = 34, top = 40, sx = 27, sy = 30;

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Diagrama de ${v.symbol}. Trastes grave a agudo: ${v.frets.join(", ")}.`);
  const mk = (tag, attrs, text) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, val] of Object.entries(attrs)) node.setAttribute(k, val);
    if (text != null) node.textContent = text;
    svg.appendChild(node);
    return node;
  };

  for (let s = 0; s < 6; s++) {
    mk("line", { x1: left + s * sx, y1: top, x2: left + s * sx, y2: top + 5 * sy, stroke: "#9aa3b2", "stroke-width": 1 });
  }
  for (let f = 0; f <= 5; f++) {
    const nut = f === 0 && baseFret === 1;
    mk("line", { x1: left, y1: top + f * sy, x2: left + 5 * sx, y2: top + f * sy, stroke: nut ? "#f3f4f6" : "#9aa3b2", "stroke-width": nut ? 5 : 1 });
  }
  if (baseFret > 1) {
    mk("text", { x: left - 20, y: top + sy * 0.65, fill: "#9aa3b2", "font-size": 12, "text-anchor": "middle" }, `${baseFret}`);
  }
  if (v.barre) {
    const row = v.barre.fret - baseFret + 1;
    mk("rect", {
      x: left + v.barre.from * sx - 9, y: top + (row - 0.5) * sy - 9,
      width: (v.barre.to - v.barre.from) * sx + 18, height: 18, rx: 9, fill: "#e7b45a"
    });
  }
  v.frets.forEach((f, s) => {
    const x = left + s * sx;
    if (f === "x") {
      mk("text", { x, y: top - 12, fill: "#f2777a", "font-size": 15, "text-anchor": "middle", "font-weight": 700 }, "×");
    } else if (f === 0) {
      mk("circle", { cx: x, cy: top - 16, r: 5, fill: "none", stroke: "#f3f4f6", "stroke-width": 1.5 });
    } else {
      const y = top + (f - baseFret + 0.5) * sy;
      mk("circle", { cx: x, cy: y, r: 10, fill: "#e7b45a" });
      const finger = v.fingers[s];
      if (finger) mk("text", { x, y: y + 4, fill: "#14161b", "font-size": 12, "text-anchor": "middle", "font-weight": 700 }, String(finger));
    }
  });
  return svg;
}

/* ---- Helpers ---- */
function button(label, onClick, ariaLabel) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  if (ariaLabel) b.setAttribute("aria-label", ariaLabel);
  b.addEventListener("click", onClick);
  return b;
}

window.addEventListener("pagehide", stopMetronome);

/* ---- Boot ---- */
rebuildLive();
renderMeetingSelect();
renderList();
